[package]
publish = false
name    = "turna-diff-test"
version.workspace = true
edition = "2021"

[[bin]]
name = "diff-test"
path = "src/main.rs"

[dependencies]
tokio       = { version = "1", features = ["full"] }
turna-proto-stun = { path = "../../crates/protocol/proto-stun" }
turna-proto-turn = { path = "../../crates/protocol/proto-turn" }
clap        = { version = "4", features = ["derive"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tracing     = "0.1"
tracing-subscriber = "0.3"

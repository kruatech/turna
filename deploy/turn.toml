# =============================================================================
# turna server configuration — annotated template
# =============================================================================
#
# Quick start (dev):
#   ./turna-node deploy/turn.toml          # works as-is, warns about defaults
#
# Production:
#   Set production = true below (or TURNA_PRODUCTION=true in env).
#   Generate secrets:  openssl rand -hex 32
#   Read docs/DEPLOY.md before deploying.
#
# Environment variable expansion is supported in any string value:
#   shared_secret = "${TURNA_SHARED_SECRET}"
#   shared_secret = "${TURNA_SHARED_SECRET:-fallback-default}"
#   shared_secret = "file:///run/secrets/turna_shared_secret"
#
# See .env.example for all supported TURNA_* variables.

# Master safety switch.
# - false (default): server starts with warnings if secrets are placeholders.
# - true: validation refuses dangerous defaults; missing external_ip is fatal;
#         placeholder secrets are fatal.
# Can also be set via TURNA_PRODUCTION=true.
production = false

# =============================================================================
# [turn] — TURN server listener and identity
# =============================================================================
[turn]
listen      = "${TURNA_LISTEN_ADDR:-0.0.0.0:3478}"
# SO_RCVBUF / SO_SNDBUF for the listener and every relay socket, in bytes.
# 0 = leave the kernel default, which is what every release before 0.5.0 did.
#
# Video is bursty: one 1080p frame is 20-60 packets within a couple of
# milliseconds. Debian's stock net.core.rmem_default is 212 992 bytes — about
# 150 packets for a socket shared by every client on that worker. Overflow is
# dropped IN THE KERNEL, before turna sees the packet, so it appears in no turna
# metric; `nstat -az UdpRcvbufErrors` is what counts it.
#
# The kernel clamps these to net.core.rmem_max / wmem_max, so raise those first
# with deploy/sysctl.d/99-turna.conf. The node logs the size it actually got and
# warns when it is smaller than the size asked for.
# socket_recv_buffer_bytes = 8388608
# socket_send_buffer_bytes = 8388608
#
# What to advertise in the STUN SOFTWARE attribute: "none" | "product" | "full".
#
# The Binding response carrying it is UNAUTHENTICATED, so whatever is here goes
# to anyone who sends 20 bytes — including a scanner matching the version
# against a CVE list — and it is ~16 bytes of free amplification on a reflected
# Binding. RFC 5389 §15.10 makes the attribute optional.
#
# "product" (the default) sends "turna" with no version, which is still enough
# for an operator debugging interop to see which implementation answered.
# "full" adds the release and is REFUSED under production = true. An
# unrecognised value is treated as "product", never as "full".
# software_attribute = "product"
#
# Allow this process to write a core dump. false by default, and that default is
# the security control: the shared secret is resident for the whole run — in the
# config, in AuthMode, and again in previous_shared_secret during a rotation —
# so a dump written by systemd-coredump (on by default in most distributions)
# puts it on disk in the clear. Compromising a TURN REST secret means minting
# credentials for anybody.
#
# Turn it on deliberately when you need a dump, then turn it off. Under
# production = true it warns at startup so it cannot be left on by accident.
# allow_core_dumps = false
# Externally reachable IP. Required in production.
# Tip: don't leave this blank behind NAT — clients receive this IP in the
# XOR-RELAYED-ADDRESS attribute.
external_ip = "${TURNA_EXTERNAL_IP:-}"
# RFC 6156 IPv6 relayed transport. Empty = IPv4-only relaying (the default): an
# Allocate carrying REQUESTED-ADDRESS-FAMILY = IPv6 is answered
# "440 Address Family not Supported".
#
# Set this to the routable IPv6 address to advertise in XOR-RELAYED-ADDRESS for
# IPv6-family allocations. The relay socket is then bound in the requested family,
# and peers of the other family are refused with 443 Peer Address Family Mismatch
# (RFC 6156 §4.2) — one allocation serves one family.
#
# NOTE: this is NOT the same as putting an IPv6 literal in external_ip above.
# That only changes what is advertised for v4-family allocations.
# NOTE: RFC 6062 TCP relay allocations stay IPv4-only regardless of this key.
# They are also refused (440) when `external_ip` above is an IPv6 literal: the
# relayed listener binds 0.0.0.0, so a v6 relayed address would be advertised and
# never served. Use a v4 `external_ip` on any node with [turn.tcp_relay] enabled.
external_ip6 = "${TURNA_EXTERNAL_IP6:-}"
realm       = "${TURNA_REALM:-turna}"
# Transport backend: tokio | io_uring | af_xdp | auto.
# - tokio (set below): epoll + recvmmsg/sendmmsg. The supported production path.
# - io_uring: supported on Linux, opt-in; build with `--features io-uring`.
#   Tested scope and sizing: docs/verification/io-uring-supported-2026-09-19.md.
# - af_xdp: supported within verified Linux IPv4 UDP copy-mode scope; opt-in.
#   Requires `--features af-xdp`, XSK/BPF/XDP privileges and a concrete listen IP.
#   Scope: docs/verification/af-xdp-supported-2026-09-22.md.
# - auto: pick io_uring when usable at runtime, else tokio. Convenient for dev,
#   but docs/PRODUCTION_READINESS.md R1 advises against it in production —
#   a kernel/build capability change would silently move your datapath.
transport   = "tokio"

[turn.auth]
# Time-limited credentials, coturn-compatible (lt-cred-mech).
# Clients build:
#   username = "{expires_unix_ts}:{user}"
#   password = base64(HMAC-SHA1(shared_secret, username))
shared_secret = "${TURNA_SHARED_SECRET:-change-me-in-production}"
token_ttl     = 86400

# coturn's secure-stun: answer an anonymous STUN Binding with a 401 challenge.
# Leave off where browsers use this node as their STUN server — they send
# Binding without credentials and would lose their reflexive candidate.
# require_binding_auth = false

# Look up users that are not configured here through your signalling service
# (docs/auth-webhook.md has the request/response contract). Off by default;
# when on, this realm uses long-term credentials: static users first, then the
# webhook. https:// and a bearer token or signing secret are required in
# production. Any lookup failure refuses the user (500) — fail closed.
# [turn.auth.webhook]
# enabled = true
# url = "https://signalling.internal/turn/credentials"
# bearer_token = "${TURNA_WEBHOOK_TOKEN}"
# signing_secret = "file:///run/secrets/turna_webhook_hmac"
# timeout_ms = 2000
# positive_ttl_secs = 300
# negative_ttl_secs = 30

# Static long-term credentials — uncomment if you want fixed users
# instead of (or in addition to) shared-secret. When non-empty,
# AuthMode::LongTerm is selected in main.rs.
# [[turn.auth.static_users]]
# username = "alice"
# password = "${TURNA_USER_ALICE_PASSWORD}"
# [[turn.auth.static_users]]
# username = "bob"
# password = "${TURNA_USER_BOB_PASSWORD}"

[turn.relay]
# Address the relay sockets bind to. Empty = 0.0.0.0, every interface, which is
# what every release before 0.5.0 did.
#
# A node with a public interface for clients and a private one to the SFU has
# relay ports 49152-65535 open on BOTH while this is empty. [turn.peer_filter]
# stops the node relaying INTO private space; it does not stop packets arriving
# on a relay port from the private side. Pin this to the public address unless
# you have a reason not to — the equivalent of coturn's `relay-ip`.
#
# With no NAT this is usually the same address as [turn] external_ip. Behind
# NAT, this is the private address the node actually owns and external_ip is
# the public one it advertises.
# bind_ip  = "203.0.113.10"
# bind_ip6 = "2001:db8::10"
min_port        = 49152
max_port        = 65535
max_allocations = 8192

# Per-user bandwidth + allocation limits. Defaults: no bandwidth cap,
# 100 simultaneous allocations per username. Set non-zero in prod to
# make abuse uneconomic.
[turn.relay.quota]
max_bytes_per_sec_per_allocation = 0     # 0 = unlimited
max_per_user      = 100   # 0 = unlimited (NOT recommended for prod)

# Node-wide cap on relayed bytes/second (both directions, all allocations) — the
# counterpart of coturn's bps-capacity, but packets over it are DROPPED rather
# than new sessions refused. 0 (default) = no cap. Goes in [turn.relay] above:
# max_total_bytes_per_sec = 125000000   # ~1 Gbit/s

# =============================================================================
# [turn.observability] — telemetry & tracing
# =============================================================================
[turn.observability]
# OpenTelemetry OTLP endpoint. Leave empty to disable OTel export.
# Logs still go to stdout regardless.
otlp_endpoint        = "${TURNA_OTLP_ENDPOINT:-}"
# Fraction of spans to sample (0.0–1.0). Errors and Allocate methods are
# always sampled regardless of this value.
trace_sample_rate    = 0.01
# JSON logs (recommended for production ingestion).
json_logs            = false
# Hard cap on spans/second to protect against runaway tracing.
max_spans_per_second = 1000

# =============================================================================
# [turn.rate_limit] — tiered rate limiting
# =============================================================================
# Two sets of tiers. `default` applies to everyone; `trusted` applies to sources
# inside trusted_prefixes. Each value is a bucket: `_burst` is its depth,
# `_rps` how fast it refills per second. Neither may be 0 — a 0 refill means the
# bucket empties once and never fills again.
#
# Why the trusted tier exists: an office of 300 people leaves through one NAT
# address, and a browser sends one Allocate per ICE transport (two typically,
# more on dual-stack). A 10:00 all-hands is ~600 Allocates from one IP, and the
# default 16/s takes 35 seconds to clear them — longer than a browser waits
# before giving up and retrying, which lengthens the queue. The data-plane
# tiers are raised too: 300 relaying participants at ~300 pps each is ~90 000
# pps from one source, against a default refill of 50 000.
#
# trusted_prefixes is NOT authentication. Anyone who can spoof a source address
# in these ranges gets the higher ceiling, so list only prefixes you route.
# Empty by default: guessing at RFC 1918 would hand the higher ceiling to
# whatever private network happens to reach this node.
#
# [turn.rate_limit]
# trusted_prefixes = ["10.10.0.0/16", "192.0.2.0/24"]
#
# [turn.rate_limit.default]
# per_ip_burst = 10000
# per_ip_rps = 50000
# per_prefix_burst = 40000
# per_prefix_rps = 200000
# allocate_burst = 32
# allocate_rps = 16
# create_permission_burst = 128
# create_permission_rps = 64
# channel_bind_burst = 128
# channel_bind_rps = 64
#
# [turn.rate_limit.trusted]
# allocate_burst = 512
# allocate_rps = 128
#
# The TURNA_RATE_LIMIT_BURST / TURNA_ALLOCATE_RPS / ... environment variables
# still override these, and now warn when they do. They are deprecated: a limit
# set there appears in no config file and in no --dump-config output, which is
# how an operator ends up looking for a ceiling that is not written down.

# =============================================================================
# [turn.auto_ban] — temporary bans after repeated failures (fail2ban built in)
# =============================================================================
# Off by default. A source that fails authentication `auth_failures` times in
# `window_secs` has every packet dropped for `ban_secs`, before any other work.
# Only failures behind a valid NONCE count, so a spoofed source cannot get a
# victim banned that way.
#
# rate_limit_violations (0 = off) also bans on rate-limiter refusals. Those are
# raw packets and CAN carry a forged source address: enable only where spoofing
# is filtered upstream. [turn.rate_limit] trusted_prefixes are exempt by default.
#
# [turn.auto_ban]
# enabled = true
# auth_failures = 10
# rate_limit_violations = 0
# window_secs = 60
# ban_secs = 600
# scope = "ip"                    # or "prefix": count and ban per /24 or /48
# allowlist = ["198.51.100.0/24"]
# exempt_trusted_prefixes = true
# max_tracked = 65536
# max_bans = 16384

# =============================================================================
# [health] — Prometheus metrics + /health endpoint
# =============================================================================
[health]
# Loopback by default. This endpoint serves /health AND the whole Prometheus
# surface — hundreds of series, including per-tenant detail — so it does not
# belong on a public interface. Override TURNA_HEALTH_ADDR with a PRIVATE
# address if Prometheus scrapes from another machine; never 0.0.0.0.
listen = "${TURNA_HEALTH_ADDR:-127.0.0.1:9090}"

# =============================================================================
# [cluster] — multi-node mode
# =============================================================================
# Leave cluster_mode=false for single-node operation. Enable it when several
# turna nodes should distribute NEW clients via consistent hashing + TURN 300
# redirects. Existing local allocations stay local until they expire.
[cluster]
# node_id MUST be unique per host. Identical ids collapse the ring to one entry
# and balancing silently no-ops. Override per host, e.g. TURNA_NODE_ID=node-east-1.
node_id      = "${TURNA_NODE_ID:-node-1}"
cluster_mode = ${TURNA_CLUSTER_MODE:-false}

# Legacy fields kept for compatibility with older configs. Prefer the explicit
# bind/seeds below for new deployments.
gossip_port = 7946
seeds       = []

# UDP gossip endpoint and seed list. Seeds are host:port strings, for example:
# gossip_seeds = ["10.0.0.11:7946", "10.0.0.12:7946"]
gossip_bind          = "${TURNA_GOSSIP_BIND:-0.0.0.0:7946}"
gossip_seeds         = []
gossip_interval_secs = 2
gossip_timeout_secs  = 30

# Externally reachable TURN address to put into ALTERNATE-SERVER.
# Leave as 0.0.0.0:0 to derive from [turn].external_ip + [turn].listen port.
turn_announce_addr = "${TURNA_TURN_ANNOUNCE_ADDR:-0.0.0.0:0}"

# Cluster identity: nodes only merge with peers sharing this name. Stops a stray
# staging node from joining a prod ring.
cluster_name = "${TURNA_CLUSTER_NAME:-turna}"

# Gossip address peers should use to reach this node. Leave 0.0.0.0:0 to infer
# from the packet source; set explicitly behind NAT / in Kubernetes.
gossip_advertise_addr = "${TURNA_GOSSIP_ADVERTISE:-0.0.0.0:0}"

# Shared secret for gossip HMAC auth. Empty = unauthenticated (a warning is
# logged). Set it so only trusted hosts can add/remove nodes from the ring.
cluster_secret = "${TURNA_CLUSTER_SECRET:-}"

# Lame-duck window (seconds): on shutdown the node announces it is leaving and
# redirects new clients away for this long before exiting. 0 = exit at once.
drain_grace_secs = 5

[cluster.backend]
# "memory" (default, single-node) | "tarantool" (cluster)
type = "${TURNA_BACKEND_TYPE:-memory}"
# host:port for Tarantool.
uri  = "${TURNA_BACKEND_URI:-}"
# Authentication for the Tarantool iproto connection. Empty user = the
# anonymous `guest` role, which has no rights on a properly-configured
# Tarantool — only use empty for local dev against an unsecured box.
#
# Production: run deploy/tarantool/init.lua to create a dedicated user
# with the minimum privileges, then set these:
user     = "${TURNA_BACKEND_USER:-}"
password = "${TURNA_BACKEND_PASSWORD:-}"
# Number of parallel TCP connections to Tarantool. 0 = use the library
# default (currently 8). Increase if you have heavy heartbeat / writer
# concurrency; decrease only if Tarantool itself is connection-limited.
pool_size = 0

[cluster.persistence]
# "disabled" (default, no write-behind) | "write_behind" (production cluster)
mode               = "${TURNA_PERSISTENCE_MODE:-disabled}"
channel_capacity   = 65536
batch_max_size     = 256
batch_max_delay_ms = 100

# =============================================================================
# [management] — gRPC control plane address (turna-control-plane reads this)
# =============================================================================
[management]
listen = "${TURNA_GRPC_ADDR:-127.0.0.1:5350}"

# =============================================================================
# [grpc] — TLS / mTLS for the management gRPC API
# =============================================================================
# Read by turna-control-plane. Cert files are loaded BY PATH at startup;
# put paths here (or in env), never PEM bodies.
#
# Modes:
#   "disabled" — plaintext. Acceptable only when [management] listen is
#                127.0.0.1 / ::1; production validation rejects "disabled"
#                with a non-loopback listen address.
#   "tls"      — server presents a cert; clients verify the server.
#   "mtls"     — both server and client present certs (recommended for
#                any deployment where the control plane is reachable
#                beyond localhost). Requires tls_ca.
#
# Env overrides: TURNA_GRPC_TLS_MODE, TURNA_GRPC_TLS_CERT, TURNA_GRPC_TLS_KEY,
# TURNA_GRPC_TLS_CA. The env value, if non-empty, wins over the file value.
[grpc]
tls_mode = "${TURNA_GRPC_TLS_MODE:-disabled}"
tls_cert = "${TURNA_GRPC_TLS_CERT:-}"
tls_key  = "${TURNA_GRPC_TLS_KEY:-}"
tls_ca   = "${TURNA_GRPC_TLS_CA:-}"

# =============================================================================
# [tls] — TURNS: TURN over TLS-over-TCP (RFC 5766/8656), port 5349/tcp
# =============================================================================
# For clients on networks that block UDP. Requires a binary built with
# `--features tls`. Also the control transport RFC 6062 TCP allocations need:
# [turn.tcp_relay] does nothing unless this listener is enabled.
#
# Maturity: beta — see docs/feature-support.md.
#
# NOTE: this is a ROOT-level section ([tls]), not [turn.tls].
#
# [tls]
# enabled = false
# listen  = "0.0.0.0:5349"
# # PEM certificate chain and private key, loaded BY PATH at startup.
# cert_path = "/etc/turna/tls/cert.pem"
# key_path  = "/etc/turna/tls/key.pem"
# # Max framed STUN/ChannelData message, bytes.
# max_frame_size = 65536
# handshake_timeout_secs = 5
# # Per-connection idle read timeout.
# read_timeout_secs = 300
# # Global connection cap.
# max_connections = 10000
# # Per-source-IP connection cap; 0 = unlimited. Defaults to 64 since 0.5.0.
# #
# # It was 0, and that mattered: one host could hold all 10 000 slots in silence
# # for the 300-second read timeout, leaving legitimate TURNS clients refused —
# # and those are the clients whose network blocks UDP, so they have no other way
# # in. The handshake rate limiter bounds speed, not how many connections are
# # held. Raise it for known NAT egress points.
# max_connections_per_ip = 64
# # Re-read cert_path/key_path every N seconds and pick up a rotated
# # certificate without a restart (new connections get the new material;
# # established ones keep their session). 0 disables reloading.
# cert_reload_secs = 30
# # Advertise ALPN "stun.turn".
# enable_alpn = true
# # Per-source-IP handshake RATE limit (handshakes/sec); 0 = unlimited.
# # max_connections_per_ip bounds CONCURRENT connections only, so a source that
# # connects and drops in a loop never trips it while still costing a TLS
# # handshake each time. Refused before the handshake.
# # Counter: turna_tls_rejected_rate_limit_total.
# max_handshakes_per_sec_per_ip = 0
# # Burst allowance for the rate limit; 0 = twice the rate.
# handshake_burst_per_ip = 0
# # RFC 7443 strict ALPN: refuse a client that negotiates no ALPN at all.
# # rustls already fails a non-overlapping ALPN offer; this covers the client
# # that offers none. Requires enable_alpn = true (otherwise startup fails).
# # Counter: turna_tls_alpn_rejected_total.
# alpn_required = false
# # mTLS for TURNS CLIENTS (not the management plane — that is [grpc] tls_ca).
# # Empty = no client-certificate verification, correct for a public TURN server.
# client_ca = ""
# # Refuse clients presenting no certificate. Needs client_ca (startup error
# # otherwise). false = unauthenticated clients still pass TLS and are then subject
# # to the normal long-term credential check — that is what allows rolling certs out
# # to an existing fleet without a flag day.
# # NOTE: no CRL/OCSP in code, deliberately (docs/MTLS.md -> Revocation). Revoke by
# # rotating the CA.
# require_client_cert = false

# =============================================================================
# [turn.tcp_relay] — RFC 6062 TCP relay allocations
# =============================================================================
# The client relays TCP (not UDP) to peers via CONNECT / CONNECTION-BIND.
# Requires [tls] enabled: RFC 6062 §4.1 mandates a TCP/TLS control connection,
# and a TCP-transport Allocate arriving over UDP/DTLS/QUIC is refused with 400.
#
# REFUSED under production = true (config validation rejects enabled = true).
# Implemented and testable with production = false; the gate lifts once interop
# and pipelined-client hardening are done.
#
# [turn.tcp_relay]
# enabled = false
# # Outbound connect timeout to the peer (failure/timeout answers 447).
# connect_timeout_secs = 30
# # Reap a peer connection that is connected but never ConnectionBind-ed.
# idle_timeout_secs = 30
# max_per_allocation = 10
# max_total = 50000
# # Per-direction relay buffer, bytes.
# buffer_size = 16384

# =============================================================================
# [turn.dtls] — TURN over DTLS (RFC 7350), port 5349/udp
# =============================================================================
# Requires `--features dtls`. Coexists with [tls] on 5349 (different protocol).
# Maturity: beta.
#
# The key MUST be PKCS#8 ECDSA P-256 — the stack negotiates ECDHE-ECDSA only,
# so an RSA key loads but every handshake then fails:
#   openssl ecparam -name prime256v1 -genkey -noout -out key.pem
#   openssl pkcs8 -topk8 -nocrypt -in key.pem -out key.pk8.pem
#
# Enabling this section on a binary built WITHOUT `--features dtls` is a
# startup error, not a warning.
#
# [turn.dtls]
# enabled = false
# listen  = "0.0.0.0:5349"
# # Both empty = ephemeral self-signed certificate (DEV ONLY). Setting only one
# # of the two is a configuration error. A configured-but-unloadable cert
# # aborts startup rather than silently downgrading to self-signed.
# cert_path = "/etc/turna/tls/cert.pem"
# key_path  = "/etc/turna/tls/key.pem"
# # Post-handshake session cap; 0 = unlimited.
# max_sessions = 10000
# # Per-source-IP session cap (anti slot-exhaustion); 0 = unlimited.
# # Defaults to 16 since 0.5.0. It was 0, which left max_sessions — a global
# # number — as the only limit, and a global limit is exhausted by one host.
# max_sessions_per_ip = 16
# # Ceiling on handshakes IN FLIGHT across the listener; 0 = unlimited.
# #
# # This is the bound that keeps a spoofed flood from exhausting memory, and it
# # is not the same thing as max_sessions: that one counts handshakes that
# # SUCCEEDED, so it bounds nothing an attacker has to do. On the demux path a
# # datagram from an unknown address allocates a channel, a map entry, a
# # connection and a task BEFORE the RFC 6347 cookie exchange has proved the
# # source address is real — webrtc-dtls runs that exchange inside the
# # connection, after the state exists.
# #
# # One ~100-byte ClientHello buys accept_timeout_secs of state. Unbounded,
# # 100 000 spoofed packets/second is an out-of-memory kill in seconds, from any
# # address, with no credentials. 512 is deliberately small: a legitimate burst
# # of new DTLS clients looks nothing like that, and refusing a datagram costs a
# # retransmit while accepting one costs memory that is not returned.
# #
# # Watch turna_dtls_pending_handshakes against turna_dtls_accepted_total: a
# # gauge near the cap with flat accepts is an attack, not load.
# max_pending_handshakes = 512
# # Per-session idle timeout. Must be > 0.
# idle_timeout_secs = 300
# # Application record MTU, 576..65535. An outbound datagram larger than this
# # is DROPPED and counted (turna_dtls_outbound_oversize_total) rather than
# # relying on IP fragmentation. Raise it if you see that counter climb.
# mtu = 1200
# # Bounded per-session egress queue; when full the NEWEST datagram is dropped
# # (turna_dtls_outbound_dropped_total) instead of blocking the relay path.
# outbound_queue_capacity = 1024
#
# # Upper bound on one DTLS accept() = one handshake; 0 disables it.
# # LIVENESS GUARD, not tuning: webrtc-dtls runs the whole handshake inline inside
# # accept() with no timeout (webrtc-rs/webrtc#614), so a peer that starts a
# # handshake and goes silent parks the accept loop forever and DTLS stops serving
# # everyone — while the socket stays bound and readiness still reads Ready.
# # Abandoned handshakes are counted: turna_dtls_accept_timeouts_total.
# accept_timeout_secs = 10
#
# # Own the UDP socket instead of using webrtc_dtls::listen(). OFF by default.
# #
# # listen() runs handshakes SERIALLY inside accept() (webrtc-rs/webrtc#614), which
# # forces three compromises: session/per-IP caps can only apply AFTER the crypto,
# # there is nowhere to enforce a handshake rate limit, and the certificate is
# # fixed at bind time. demux = true fixes all three: one task per handshake,
# # admission before any DTLS state exists, and live certificate reload.
# #
# # It replaces the code path that has recorded verification behind it
# # (docs/dtls/), so it is opt-in until its own interop run is on record.
# demux = false
# # The next three require demux = true; config validation rejects them otherwise
# # rather than let them read as protection that is not there.
# max_handshakes_per_sec_per_ip = 0
# handshake_burst_per_ip = 0
# cert_reload_secs = 0
#
# NOTE: with demux = false (the default) DTLS cannot hot-reload its certificate —
# the stack fixes its config at listen time. Rotating the files logs a warning and
# needs a node restart.

# =============================================================================
# [turn.sctp] — TURN-over-SCTP (supported on Linux/tokio)
# =============================================================================
# Opt-in native SCTP for TURN control and ChannelData; peer-side relay stays UDP.
# Requires --features sctp, Linux kernel SCTP support and turn.transport = "tokio".
# Allowed with production = true; normal production validation still applies.
# IP protocol 132 must pass through the network (not TCP/UDP). No TLS encryption.
# Project-specific TURN mapping, not browser WebRTC DataChannel.
# Evidence: docs/verification/sctp-supported-2026-09-18.md
#
# [turn.sctp]
# enabled = false
# listen = "0.0.0.0:3478"
# max_frame_size = 65536
# read_timeout_secs = 300
# max_connections = 10000
# max_connections_per_ip = 0
# max_associations_per_sec_per_ip = 0
# association_burst_per_ip = 0
# backlog = 1024

# =============================================================================
# [turn.quic] — QUIC / WebTransport listener
# =============================================================================
# Requires `--features quic` (raw QUIC) or `--features web-transport` (browser
# HTTP/3 CONNECT, implies quic). Supported on Linux/macOS with tokio.
#
# Enabling this without the matching feature is a startup error. With
# web_transport = true you need `--features web-transport` specifically.
#
# Both paths apply transport limits, admission and per-stream replies.
# Only alpn is raw-QUIC-only: WebTransport negotiates h3.
# Scope: docs/verification/quic-webtransport-supported-2026-09-18.md.
#
# [turn.quic]
# enabled = false
# # true = WebTransport over HTTP/3 (browsers); false = raw QUIC datapath.
# web_transport = true
# listen = "0.0.0.0:5350"
# cert_path = "/etc/turna/tls/cert.pem"
# key_path  = "/etc/turna/tls/key.pem"
# max_bi_streams = 256
# max_uni_streams = 256
# enable_datagrams = true
# max_datagram_size = 1200
# idle_timeout_secs = 30
# keep_alive_secs = 10
# alpn = ["stun.turn"]
# # Session caps, same semantics as [turn.dtls]; 0 = unlimited.
# max_sessions = 10000
# # Defaults to 16 since 0.5.0, for the same reason as the DTLS one: a global
# # cap is exhausted by a single host.
# max_sessions_per_ip = 16
# #
# # NOTE on address validation, which has no key here because it is
# # unconditional: an Initial from an address quinn has not validated is
# # answered with a Retry (RFC 9000 §8.1) instead of a handshake. Without that,
# # every spoofed Initial bought a full TLS 1.3 handshake — ECDHE plus a
# # certificate signature — which is a cryptographic denial of service that
# # needs no amplification to work. It costs a real client one extra round trip
# # on its first connection; watch turna_quic_retries_sent_total.
# #
# # Both paths do this. On the WebTransport path the check runs before the
# # per-IP tables are touched: admitting an unvalidated Initial would let a
# # spoofed source consume a slot belonging to an address that never sent
# # anything.
# # Per-source-IP handshake RATE limit; 0 = unlimited. max_sessions_per_ip only
# # bounds concurrent sessions, so a source that opens and drops sessions in a
# # loop never trips it while still costing a handshake each time. Off by
# # default; set it on any internet-facing listener.
# max_handshakes_per_sec_per_ip = 0
# # Burst allowance; 0 = twice the rate.
# handshake_burst_per_ip = 0
# # Certificate hot-reload poll, seconds. Both paths; new sessions use the
# # new certificate and existing sessions remain connected. 0 disables.
# cert_reload_secs = 30
#
# NOTE: the default listen port 5350/udp collides numerically with
# [management].listen 5350/tcp. Different protocols, so the binds do not
# conflict, but pick another port if that ambiguity bothers your tooling.

# Host tuning for a turna TURN/STUN node.
#
#   install -m 0644 deploy/sysctl.d/99-turna.conf /etc/sysctl.d/99-turna.conf
#   sysctl --system
#
# Every value here has a reason next to it. Do not copy it onto a host that runs
# something else as well without reading them — these are sized for a machine
# whose job is relaying media.
#
# The companion document is docs/deployment/host-tuning.md, which covers NUMA,
# IRQ affinity and the measured capacity ceiling. This file is only the part that
# belongs in sysctl.

# --- Socket buffers ---------------------------------------------------------
#
# `[turn] socket_recv_buffer_bytes` in turn.toml asks for a buffer; the kernel
# clamps the request to rmem_max and says nothing. Raising the ceiling here is
# what makes the config key effective. The node logs the size it actually got.
#
# Why it matters: video is bursty. One 1080p frame is 20-60 UDP packets arriving
# within a couple of milliseconds, and the stock rmem_default of 212 992 bytes is
# roughly 150 packets for the whole socket. The main listener is one socket per
# worker (SO_REUSEPORT), shared by every client on it. An overflow is dropped in
# the kernel, before turna sees the packet — so it appears in no turna metric at
# all. `nstat -az UdpRcvbufErrors` is what counts it.
#
# 16 MiB is a ceiling, not an allocation: memory is only used as a socket fills.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Default for sockets that do not set a size explicitly. 1 MiB rather than 16:
# this one IS applied to every socket on the host, including ones with nothing to
# do with turna.
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# --- NIC backlog ------------------------------------------------------------
#
# Packets queued between the NIC's interrupt and the softirq that processes
# them. The default (1000 on most distributions) is sized for a general-purpose
# host, and a relay at tens of thousands of packets per second is not one.
# Overflow here is counted in /proc/net/softnet_stat, column 2.
net.core.netdev_max_backlog = 16384

# --- Ephemeral port range ---------------------------------------------------
#
# This one is a correctness setting, not a performance one, and it is the most
# important line in the file.
#
# The default relay range (49152-65535) overlaps the default ephemeral range on
# most Linux hosts. A peer socket landing inside the relay range makes the relay
# forward to itself — this has happened in this project. Moving the ephemeral
# range below the relay range keeps them disjoint.
#
# If you narrowed [turn.relay] min_port/max_port instead, adjust this to match,
# and run scripts/verify/deployment-compliance.sh, which checks the two against
# each other on the actual host rather than assuming.
net.ipv4.ip_local_port_range = 16384 49151

# --- File descriptors -------------------------------------------------------
#
# One descriptor per relay socket plus the listeners. A node at 10 000
# allocations needs at least that many, and the failure when it runs out is
# allocations rejected with no obvious cause.
#
# This is the system-wide ceiling; the per-process limit is separate — see
# LimitNOFILE in deploy/systemd/turna-node.service, or `ulimits` in
# deploy/docker-compose.yml.
fs.file-max = 2097152

# --- Conntrack --------------------------------------------------------------
#
# Only relevant when a stateful firewall is in the path. Commented out because
# the modules may not be loaded, and setting an unknown key makes `sysctl
# --system` fail the whole file.
#
# Size for FLOWS, not clients: each relayed session is at least two. The UDP
# stream timeout matters more than it looks — the default 120 s can be shorter
# than a client's refresh interval, and a flow dropped between refreshes is a
# glitch the user notices and no counter records.
#
# net.netfilter.nf_conntrack_max = 262144
# net.netfilter.nf_conntrack_udp_timeout_stream = 180

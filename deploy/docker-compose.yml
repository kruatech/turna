# Turna TURN/STUN — Docker Compose
#
# Usage from repository root:
#   docker compose -f deploy/docker-compose.yml up --build
#   docker compose -f deploy/docker-compose.yml logs -f turna
#
# Services:
#   turna      — TURN/STUN server (UDP:3478, TURNS TCP:5349; health on 127.0.0.1:9090)
#   prometheus — optional metrics collection (host TCP:9091)
#
# Both services use host networking. See the note on the turna service.

services:
  turna:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: turna:local
    # Host networking, which is the standard for a TURN server and not a
    # shortcut. Publishing 16 384 UDP relay ports through the bridge creates a
    # forwarding rule per port and, depending on the Docker version and
    # userland-proxy setting, a docker-proxy process per port: container start
    # measured in tens of seconds, memory spent on nothing, and an extra NAT hop
    # on the media path.
    #
    # It also means the node sees real client source addresses. Behind the
    # bridge it sees the gateway's, which quietly breaks per-IP rate limiting —
    # every client shares one bucket.
    #
    # The trade: no port isolation from the host, and [health] listen must be a
    # real bind address rather than something the bridge hides. deploy/turn.toml
    # binds health to 127.0.0.1 for that reason.
    network_mode: host
    environment:
      RUST_LOG: "info,turna=debug"
      TURNA_WORKERS: "0" # 0 = auto-detect
    volumes:
      - ./turn.toml:/etc/turna/turn.toml:ro
      # TLS certs (optional, only when [tls].enabled = true)
      # - ./tls:/etc/turna/tls:ro
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.50.1
    # Also host networking, and it has to be: turna binds health/metrics to
    # 127.0.0.1, which a container on the bridge cannot reach. The alternative —
    # opening 9090 to every interface so the bridge can scrape it — puts the
    # full metric surface on the network, which is what this change is avoiding.
    network_mode: host
    # Moved off 9090 explicitly. Prometheus defaults to it, and on the host
    # network that is turna's health port; the published "9091:9090" mapping
    # that used to separate them does not exist in host mode.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=:9091
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    depends_on:
      turna:
        condition: service_healthy

volumes:
  prometheus_data:

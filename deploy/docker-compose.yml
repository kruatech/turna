# Turna TURN/STUN — Docker Compose
#
# Usage from repository root:
#   docker compose -f deploy/docker-compose.yml up --build
#   docker compose -f deploy/docker-compose.yml logs -f turna
#
# Services:
#   turna      — TURN/STUN server (UDP/TCP:3478, health/metrics:9090)
#   prometheus — optional metrics collection (host TCP:9091)

services:
  turna:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: turna:local
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "9090:9090/tcp"
      # Relay ports for local/dev tests. Keep this range in sync with
      # deploy/turn.toml [turn.relay] when you narrow it for testing.
      - "49152-50152:49152-50152/udp"
    environment:
      RUST_LOG: "info,turna=debug"
      TURNA_WORKERS: "0" # 0 = auto-detect
    volumes:
      - ./turn.toml:/etc/turna/turn.toml:ro
      # TLS certs (optional, only when [tls].enabled = true)
      # - ./tls:/etc/turna/tls:ro
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - turna

  prometheus:
    image: prom/prometheus:v2.50.1
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    depends_on:
      turna:
        condition: service_healthy
    networks:
      - turna

volumes:
  prometheus_data:

networks:
  turna:
    driver: bridge

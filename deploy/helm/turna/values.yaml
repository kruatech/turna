replicaCount: 1

production: false

image:
  repository: turna
  tag: "0.1.0"
  pullPolicy: IfNotPresent

turn:
  realm: "turna"
  listenPort: 3478
  healthPort: 9090
  managementPort: 5350
  externalIP: "" # Required when production=true or cluster.enabled=true without hostNetwork announce override
  transport: "tokio" # tokio | auto | io_uring
  turnUrl: "turn:127.0.0.1:3478"
  relayPortRange:
    min: 49152
    max: 65535
  maxAllocations: 50000
  quota:
    maxBytesPerSec: 0
    maxPerUser: 100
  auth:
    sharedSecret: "change-me-in-production"
    staticUsers: []
    # - username: alice
    #   password: secret
  workers: 0 # 0 = auto-detect CPU count

resources:
  turn:
    requests:
      cpu: "1"
      memory: "512Mi"
    limits:
      cpu: "4"
      memory: "2Gi"

service:
  type: LoadBalancer
  annotations: {}
  # For AWS NLB:
  # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

nodeSelector: {}

tolerations: []

affinity: {}

# Host networking is recommended for production TURN because Kubernetes Service
# objects cannot compactly expose arbitrary relay UDP port ranges.
hostNetwork: false

# Prometheus ServiceMonitor
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 15s

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Sysctls for network performance. Some managed clusters disallow net.core
# sysctls; disable this block if the pod is rejected by admission control.
sysctls:
  enabled: true
  values:
    - name: net.core.rmem_max
      value: "8388608"
    - name: net.core.wmem_max
      value: "8388608"

# Multi-node cluster (gossip discovery + TURN-redirect load balancing).
# When enabled, the TURN workload is deployed as a StatefulSet (stable per-pod
# node_id) with a headless Service for gossip, instead of a Deployment.
cluster:
  enabled: false
  name: "turna" # cluster identity; MUST match across all pods
  replicas: 3
  gossipPort: 7946
  gossipIntervalSecs: 2
  gossipTimeoutSecs: 30
  drainGraceSecs: 5
  # Shared HMAC secret for gossip authentication. Prefer existingSecret (a
  # Secret containing key `cluster-secret`) over the inline `secret`.
  secret: ""
  existingSecret: ""

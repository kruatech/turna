replicaCount: 1

production: false

image:
  repository: turna
  tag: "0.3.0-rc.2"
  pullPolicy: IfNotPresent

turn:
  realm: "turna"
  listenPort: 3478
  healthPort: 9090
  managementPort: 5350
  externalIP: "" # Required when production=true; must belong to this node/pod
  nodeId: "turna-standalone" # Stable durable-state key for the standalone node
  transport: "tokio" # GA production backend; auto/io_uring remain opt-in
  turnUrl: "turn:127.0.0.1:3478"
  relayPortRange:
    min: 49152
    max: 65535
  # Per-node UDP allocation cap. 8192 is the conservative ceiling for the default
  # relay range (49152-65535 = 16384 ports) under EVEN-PORT worst-case, where one
  # allocation may reserve a second port. Scale total capacity by replicas
  # (N nodes ~= N x 8192), not by raising this or widening the range.
  maxAllocations: 8192
  quota:
    maxBytesPerSecPerAllocation: 0
    maxPerUser: 100
    # In production (production=true) an unlimited per-allocation bandwidth
    # cap (maxBytesPerSecPerAllocation=0) is refused unless this explicit accepted-risk
    # flag is set (P0 #7). Prefer a real maxBytesPerSecPerAllocation cap; set this true
    # only when you have deliberately accepted running without one.
    allowUnlimitedBandwidth: false
  auth:
    # TURN long-term/shared secret. It is NEVER written into the ConfigMap; the
    # config references it as ${TURNA_SHARED_SECRET} and it is injected as an
    # env var from a Secret.
    #
    # Resolution order:
    #   1. existingSecret set -> read existingSecretKey from that Secret.
    #   2. else sharedSecret non-empty -> a chart-managed Secret is created.
    #   3. else (both empty) -> no secret injected (dev only; shared-secret auth
    #      effectively disabled). production=true rejects an empty/placeholder
    #      secret at startup.
    #
    #   For production prefer existingSecret; the chart-managed sharedSecret
    #   path is intended for dev/demo only.
    sharedSecret: ""
    existingSecret: ""
    existingSecretKey: "shared-secret"
    staticUsers: []
    # - username: alice
    #   password: secret
  workers: 0 # 0 = auto-detect CPU count

resources:
  turn:
    requests:
      cpu: "1"
      memory: "512Mi"
    limits:
      cpu: "4"
      memory: "2Gi"

# Liveness/readiness HTTP probe paths on turn.healthPort.
# readinessPath MUST be an endpoint that only reports ready once the server can
# actually serve TURN traffic (state backend / control plane up). The health
# crate exposes /health (liveness) and /ready (readiness).
probes:
  livenessPath: /health
  readinessPath: /ready

# Pod-level security context. Defaults assume the image runs as the pinned
# non-root uid/gid 65532 (see deploy/Dockerfile). If you build the image with a
# different user, override runAsUser/runAsGroup/fsGroup to match, or set
# runAsNonRoot: false.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level security context. readOnlyRootFilesystem is satisfied via
# writable emptyDir mounts for /tmp and /var/run/turna.
# NOTE: the AF_XDP / BPF datapath needs extra capabilities (e.g. NET_RAW,
# NET_ADMIN, BPF, SYS_ADMIN) and likely privileged/hostNetwork. Enable them by
# overriding this block ONLY when running that datapath; the default below is
# correct for the tokio/io_uring UDP path.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: LoadBalancer
  annotations: {}
  # For AWS NLB:
  # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

nodeSelector: {}

tolerations: []

affinity: {}

# Host networking is recommended for production TURN because Kubernetes Service
# objects cannot compactly expose arbitrary relay UDP port ranges.
hostNetwork: false

# Prometheus ServiceMonitor
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 15s

# Pod disruption budget. Disabled by default: with replicaCount=1 a PDB of
# minAvailable=1 blocks voluntary evictions (node drains) of the only pod.
# Enable it together with replicas > 1 (see values-production.example.yaml).
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1   # alternative to minAvailable; set only one

# Sysctls for network performance. Some managed clusters disallow net.core
# sysctls; disable this block if the pod is rejected by admission control.
sysctls:
  enabled: true
  values:
    - name: net.core.rmem_max
      value: "8388608"
    - name: net.core.wmem_max
      value: "8388608"

# Optional NetworkPolicy. TURN is a relay: it must egress UDP/TCP to arbitrary
# peer addresses, so egress is intentionally broad (DNS explicit + all UDP/TCP).
# Ingress is what gets locked down: TURN/STUN and the relay UDP range stay
# public, health/metrics are restricted to the sources listed in metricsFrom.
# Requires Kubernetes >= 1.25 for the relay-range endPort.
networkPolicy:
  enabled: false
  # NetworkPolicyPeers allowed to reach the health/metrics port (turn.healthPort).
  # Default: any in-cluster namespace. Tighten to your monitoring namespace.
  metricsFrom:
    - namespaceSelector: {}
  # Extra egress rules appended to the built-in DNS + relay egress.
  extraEgress: []

# Spread pods across nodes/zones. A list of TopologySpreadConstraint; empty by
# default. Recommended with replicas > 1 / cluster mode. Example:
# topologySpreadConstraints:
#   - maxSkew: 1
#     topologyKey: topology.kubernetes.io/zone
#     whenUnsatisfiable: ScheduleAnyway
#     labelSelector:
#       matchLabels:
#         app.kubernetes.io/name: turna
topologySpreadConstraints: []

# Durable state backend. Enable this for runtime update_config/set_user_limits
# persistence and restart restore even when cluster.enabled=false. The chart does
# not install Tarantool; point uri at a separately managed instance.
state:
  enabled: false
  type: "memory" # memory | tarantool
  uri: ""
  user: ""
  existingSecret: ""
  existingSecretKey: "backend-password"
  poolSize: 8
  persistenceMode: "disabled" # disabled | write_behind
  userRefreshSecs: 30

# EXPERIMENTAL multi-node profile (gossip + TURN 300 redirects). It does not
# provide transparent active-allocation continuity or zero-gap rolling upgrades.
# GA is standalone-first; when enabled this uses a StatefulSet and per-pod IDs.
cluster:
  enabled: false
  name: "turna" # cluster identity; MUST match across all pods
  replicas: 3
  gossipPort: 7946
  gossipIntervalSecs: 2
  gossipTimeoutSecs: 30
  drainGraceSecs: 5
  # Shared HMAC secret for gossip authentication. Prefer existingSecret (a
  # Secret containing key `cluster-secret`) over the inline `secret`.
  secret: ""
  existingSecret: ""

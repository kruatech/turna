{{- if not .Values.cluster.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-turn
  labels:
    app.kubernetes.io/name: turna
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: turna
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: turna
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # Allow the standalone pod to finish drain, persist terminal state, and join tasks.
      terminationGracePeriodSeconds: {{ add .Values.cluster.drainGraceSecs 25 }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      securityContext:
        {{- with .Values.podSecurityContext }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.sysctls.enabled }}
        sysctls:
        {{- range .Values.sysctls.values }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        {{- end }}
      containers:
        - name: turn
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args: ["/etc/turna/turn.toml"]
          ports:
            - name: stun-udp
              containerPort: {{ .Values.turn.listenPort }}
              protocol: UDP
              {{- if .Values.hostNetwork }}
              hostPort: {{ .Values.turn.listenPort }}
              {{- end }}
            - name: stun-tcp
              containerPort: {{ .Values.turn.listenPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.turn.healthPort }}
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,turna=debug"
            - name: TURNA_WORKERS
              value: {{ .Values.turn.workers | quote }}
            {{- if and .Values.state.enabled .Values.state.existingSecret }}
            - name: TURNA_BACKEND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.state.existingSecret }}
                  key: {{ .Values.state.existingSecretKey }}
            {{- end }}
            {{- if or .Values.turn.auth.existingSecret .Values.turn.auth.sharedSecret }}
            - name: TURNA_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.turn.auth.existingSecret }}
                  name: {{ .Values.turn.auth.existingSecret }}
                  key: {{ .Values.turn.auth.existingSecretKey }}
                  {{- else }}
                  name: {{ .Release.Name }}-turn-auth
                  key: shared-secret
                  {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources.turn | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/turna/turn.toml
              subPath: turn.toml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/turna
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

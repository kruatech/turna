{{- if .Values.cluster.enabled }}
# Cluster mode: StatefulSet gives each pod a stable ordinal name, which we use
# as a stable, unique node_id. The headless `-gossip` Service provides per-pod
# DNS for gossip seeding.
#
# NOTE on external reachability: ALTERNATE-SERVER (the 300 redirect target) must
# be an address the *client* can reach. The pod IP is cluster-internal, so for
# real (external) WebRTC clients enable hostNetwork — then each pod advertises
# its node's IP. Gossip itself always uses the in-cluster pod IP.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-turn
  labels:
    app.kubernetes.io/name: turna
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-gossip
  replicas: {{ .Values.cluster.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: turna
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: turna
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      # Must cover the node's full shutdown budget (P0 #8): lame-duck drain
      # (drainGraceSecs) + persistence flush (~10s) + background task joins
      # (~10s) + safety margin. Too small and kubelet SIGKILLs mid-flush.
      terminationGracePeriodSeconds: {{ add .Values.cluster.drainGraceSecs 25 }}
      securityContext:
        {{- with .Values.podSecurityContext }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.sysctls.enabled }}
        sysctls:
        {{- range .Values.sysctls.values }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        {{- end }}
      containers:
        - name: turn
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args: ["/etc/turna/turn.toml"]
          ports:
            - name: stun-udp
              containerPort: {{ .Values.turn.listenPort }}
              protocol: UDP
              {{- if .Values.hostNetwork }}
              hostPort: {{ .Values.turn.listenPort }}
              {{- end }}
            - name: stun-tcp
              containerPort: {{ .Values.turn.listenPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.turn.healthPort }}
              protocol: TCP
            - name: gossip-udp
              containerPort: {{ .Values.cluster.gossipPort }}
              protocol: UDP
          env:
            - name: RUST_LOG
              value: "info,turna=debug"
            - name: TURNA_WORKERS
              value: {{ .Values.turn.workers | quote }}
            # Stable, unique node_id from the StatefulSet ordinal pod name.
            - name: TURNA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Gossip advertise = in-cluster pod IP (peers reach us here).
            - name: TURNA_GOSSIP_ADVERTISE
              value: "$(POD_IP):{{ .Values.cluster.gossipPort }}"
            {{- if .Values.hostNetwork }}
            # With hostNetwork the node IP is the externally-reachable address
            # for the 300 redirect target.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: TURNA_TURN_ANNOUNCE_ADDR
              value: "$(HOST_IP):{{ .Values.turn.listenPort }}"
            {{- end }}
            {{- if and .Values.state.enabled .Values.state.existingSecret }}
            - name: TURNA_BACKEND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.state.existingSecret }}
                  key: {{ .Values.state.existingSecretKey }}
            {{- end }}
            {{- if or .Values.turn.auth.existingSecret .Values.turn.auth.sharedSecret }}
            - name: TURNA_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.turn.auth.existingSecret }}
                  name: {{ .Values.turn.auth.existingSecret }}
                  key: {{ .Values.turn.auth.existingSecretKey }}
                  {{- else }}
                  name: {{ .Release.Name }}-turn-auth
                  key: shared-secret
                  {{- end }}
            {{- end }}
            - name: TURNA_CLUSTER_SECRET
              {{- if .Values.cluster.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cluster.existingSecret }}
                  key: cluster-secret
              {{- else }}
              value: {{ .Values.cluster.secret | quote }}
              {{- end }}
          resources:
            {{- toYaml .Values.resources.turn | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/turna/turn.toml
              subPath: turn.toml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/turna
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

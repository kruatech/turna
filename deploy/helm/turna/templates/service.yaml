apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-turn
  labels:
    app.kubernetes.io/name: turna
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Public service: TURN/STUN only. Health, metrics and management are NOT
  # exposed here — see the internal ClusterIP service below.
  type: {{ .Values.service.type }}
  ports:
    - name: stun-udp
      port: {{ .Values.turn.listenPort }}
      targetPort: stun-udp
      protocol: UDP
    - name: stun-tcp
      port: {{ .Values.turn.listenPort }}
      targetPort: stun-tcp
      protocol: TCP
  selector:
    app.kubernetes.io/name: turna
    app.kubernetes.io/instance: {{ .Release.Name }}
---
# Internal service: health + Prometheus metrics, cluster-internal only.
# Point any ServiceMonitor at this service, not the public LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-internal
  labels:
    app.kubernetes.io/name: turna
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: health
      port: {{ .Values.turn.healthPort }}
      targetPort: health
      protocol: TCP
  selector:
    app.kubernetes.io/name: turna
    app.kubernetes.io/instance: {{ .Release.Name }}
---
{{- if .Values.cluster.enabled }}
# Headless service: stable per-pod DNS for gossip seeding and the StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gossip
  labels:
    app.kubernetes.io/name: turna
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: gossip-udp
      port: {{ .Values.cluster.gossipPort }}
      targetPort: gossip-udp
      protocol: UDP
  selector:
    app.kubernetes.io/name: turna
    app.kubernetes.io/instance: {{ .Release.Name }}
---
{{- end }}

# System user for the turna TURN/STUN server (systemd-sysusers(8)).
# Installed by the .deb/.rpm package to /usr/lib/sysusers.d/turna-node.conf.
# No home directory and no login shell: the service reads its config and writes
# nothing under normal operation.
u turna - "turna TURN/STUN server" /nonexistent /usr/sbin/nologin

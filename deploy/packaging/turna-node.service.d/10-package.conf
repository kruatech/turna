# Installed by the turna-node .deb/.rpm package.
#
# deploy/systemd/turna-node.service is shared with manual installs, which put the
# binary in /usr/local/bin. A distribution package must not install there, so
# the package ships the same unit unchanged and repoints ExecStart here instead
# of carrying a second copy of the unit that could drift from the first.
[Service]
ExecStart=
ExecStart=/usr/bin/turna-node /etc/turna/turn.toml
# Optional: TURNA_SHARED_SECRET and the other TURNA_* variables deploy/turn.toml
# reads (see .env.example). Mode 0640 root:turna. The leading "-" makes it
# optional, so a node configured entirely in turn.toml needs no such file.
EnvironmentFile=-/etc/turna/secrets.env

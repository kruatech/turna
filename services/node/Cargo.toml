[package]
publish = false
name = "turna-node"
version.workspace = true
edition.workspace = true

[features]
tls = ["turna-relay/tls", "turna-transport/tls"]
sctp = ["turna-relay/sctp", "turna-transport/sctp"]
# TURNS is in `default` because it is the only TCP entry point this node has:
# there is no plain TURN-over-TCP listener (docs/interop/transports-2026-08-19.md),
# so a build without `tls` cannot serve a client whose network blocks UDP. The
# safe configuration has to be the one you get by doing nothing; opting out is
# `--no-default-features`, which is an explicit decision someone owns.
default = ["tls"]
io-uring = ["turna-transport/io-uring", "turna-relay/io-uring"]
# Raw QUIC datapath. WebTransport (browser H3) builds on it.
quic = ["turna-transport/quic"]
web-transport = ["quic", "turna-transport/web-transport"]
# AF_XDP ring datapath backend (Linux only).
af-xdp = ["turna-transport/af-xdp"]
# TURN over DTLS (RFC 7350).
dtls = ["turna-transport/dtls"]

# prctl(PR_SET_DUMPABLE) and setrlimit(RLIMIT_CORE) at startup, so the shared
# secret cannot end up in a core dump. Already in the tree via turna-transport,
# so no new crate enters the graph.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
# Overwrites the spare copy of the shared secret left by a SIGHUP reload.
zeroize.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
turna-config.workspace = true
turna-observability.workspace = true
turna-transport.workspace = true
turna-relay.workspace = true
turna-control.workspace = true
turna-cluster.workspace = true
turna-session.workspace = true
turna-auth.workspace = true
turna-health.workspace = true
hostname.workspace = true
# PR2 (task #3): write-behind writer task uses the state backend.
turna-state-backend.workspace = true
turna-proto-turn.workspace = true
serde.workspace = true
serde_json.workspace = true
# PR A (task 2.4): system resource metrics in heartbeat.
sysinfo = "0.39"
# Usage-accounting webhook ([turn.accounting.webhook]). Already in the workspace
# graph through turna-admin, so no new crate or licence enters Cargo.lock.
# `rustls-no-provider` rather than `rustls`: the latter pins aws-lc-rs, and this
# binary's rustls uses ring everywhere (turna-transport). accounting.rs installs
# ring as the process default before building the client.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

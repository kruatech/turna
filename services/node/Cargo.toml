[package]
publish = false
name = "turna-node"
version.workspace = true
edition.workspace = true

[features]
tls = ["turna-relay/tls", "turna-transport/tls"]
sctp = ["turna-relay/sctp", "turna-transport/sctp"]
default = []
io-uring = ["turna-transport/io-uring", "turna-relay/io-uring"]
# Raw QUIC datapath. WebTransport (browser H3) builds on it.
quic = ["turna-transport/quic"]
web-transport = ["quic", "turna-transport/web-transport"]
# AF_XDP ring datapath backend (Linux only).
af-xdp = ["turna-transport/af-xdp"]
# TURN over DTLS (RFC 7350).
dtls = ["turna-transport/dtls"]

[dependencies]
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true
turna-config.workspace = true
turna-observability.workspace = true
turna-transport.workspace = true
turna-relay.workspace = true
turna-cluster.workspace = true
turna-session.workspace = true
turna-auth.workspace = true
turna-health.workspace = true
hostname.workspace = true
# PR2 (task #3): write-behind writer task uses the state backend.
turna-state-backend.workspace = true
turna-proto-turn.workspace = true
serde.workspace = true
serde_json.workspace = true
# PR A (task 2.4): system resource metrics in heartbeat.
sysinfo = "0.39"

[package]
name = "turna-admin"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Admin panel bridge for turna monitoring and authenticated gRPC management."

[[bin]]
name = "turna-admin"
path = "src/main.rs"

[dependencies]
# HTTP server + static files
axum        = "0.8"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tower       = "0.5"
tower-http  = { version = "0.6", features = ["fs", "trace"] }

# HTTP upstream client (read-only: /status /metrics /health /ready /cluster)
reqwest     = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# gRPC client to the control plane
tonic       = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
prost       = "0.14"

# Serialisation / CLI / logging
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
clap        = { version = "4", features = ["derive", "env"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow      = "1"

[build-dependencies]
tonic-prost-build = "0.14"

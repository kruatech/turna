# turna config for the benchmark harness (bench/run.sh, bench/matrix.sh).
# Plain UDP on 3478, TURN REST auth, no TLS — the same surface as
# bench/coturn.conf, bench/eturnal.yml and bench/pion-turn.
#
# Two deliberate departures from turna's defaults, both so the harness measures
# the server rather than an admission policy that coturn does not have:
#
#   - [turn.rate_limit.default]: coturn applies no per-source Allocate,
#     CreatePermission or ChannelBind limit by default; turna does (Allocate:
#     burst 32, 16/s per source address), plus per-address and per-/24 packet
#     tiers. matrix.sh spreads clients over up to 65 534 loopback addresses,
#     which keeps most sources under those defaults — but not with a small
#     SOURCE_IPS, not bench/run.sh's direct invocations, and not the per-/24
#     tier, which every 256 spread addresses share. Raised so that no setting of
#     the harness measures a limiter instead of the server. 16_000_000 stays
#     under the token bucket's 24-bit ceiling (crates/qos, TOKEN_MASK); there is
#     no "unlimited" value. The fixed unauthenticated-reply budget (8/s per
#     source) is not configurable and is what the spread is for.
#   - [turn.relay.quota] max_per_user = 0: REST usernames are
#     "<expiry>:bench", so every allocation in the same second shares one
#     username and the default of 100 per user would cap the relay and memory
#     scenarios. coturn's user-quota default is also 0 (unlimited).
#
# These replace the TURNA_RATE_LIMIT_* / TURNA_PREFIX_* environment overrides the
# scripts used to export: those are deprecated and warn at startup
# (crates/relay/src/processor.rs, RateLimitSettings::env_overrides).

production = false

[turn]
listen      = "0.0.0.0:3478"
external_ip = "127.0.0.1"
realm       = "bench"

[turn.auth]
# REST shared secret — the same value is configured into coturn
# (use-auth-secret), eturnal (secret) and the pion bench server, so
# one load-test invocation works against all of them.
shared_secret = "bench-secret"
token_ttl     = 86400

[turn.relay]
min_port        = 50000
max_port        = 65535
max_allocations = 15000   # below the 15 536 ports in the range; validation refuses more

[turn.relay.quota]
max_per_user = 0

[turn.rate_limit.default]
per_ip_burst            = 16000000
per_ip_rps              = 16000000
per_prefix_burst        = 16000000
per_prefix_rps          = 16000000
allocate_burst          = 16000000
allocate_rps            = 16000000
create_permission_burst = 16000000
create_permission_rps   = 16000000
channel_bind_burst      = 16000000
channel_bind_rps        = 16000000

[turn.peer_filter]
# The relay scenario's peer sockets are on loopback. coturn gets the matching
# allow-loopback-peers in bench/coturn.conf.
allow_loopback_peers = true

[health]
listen = "0.0.0.0:9190"

[management]
listen = "127.0.0.1:5350"

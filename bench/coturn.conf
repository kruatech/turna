# Minimal coturn config for the benchmark.
# Equivalent surface area to bench/turna.toml: STUN binding on a single
# UDP port, no auth, no TLS, single realm. Used by bench/run.sh.

# Listen on a different port from turna so we can run both in parallel.
listening-port=3479

# Same loopback IP as turna for apples-to-apples.
listening-ip=127.0.0.1
relay-ip=127.0.0.1

# A small relay range so we don't fight with turna over ports.
min-port=40000
max-port=49999

# TURN REST auth — same shared secret as bench/turna.toml so the
# allocate/channeldata scenarios use identical credentials everywhere.
# STUN binding stays unauthenticated regardless.
use-auth-secret
static-auth-secret=bench-secret

# No TLS — bench is plain UDP STUN binding only.
no-tls
no-dtls

# Quiet logs — we don't want them affecting wall clock measurements.
no-stdout-log
log-file=/tmp/coturn-bench.log
no-stale-nonce
no-multicast-peers

# Same realm name (cosmetic).
realm=bench

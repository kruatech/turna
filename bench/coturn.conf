# coturn config for the benchmark harness (bench/run.sh, bench/matrix.sh).
# Same surface as bench/turna.toml: plain UDP, TURN REST auth with the same
# secret, one realm, loopback peers allowed for the relay scenario.
#
# Pinned version: see COTURN_IMAGE / COTURN_NATIVE_VERSION in bench/matrix.sh.
# Every option below is in the long-option table of src/apps/relay/mainrelay.c
# at both pinned tags (4.6.1 and 4.7.0), checked 2026-09-24.

# Listen on a different port from turna so ports never collide.
listening-port=3479

# Same loopback IP as turna for apples-to-apples.
listening-ip=127.0.0.1
relay-ip=127.0.0.1

# A relay range that does not overlap turna's (50000-65535) or eturnal's.
min-port=40000
max-port=49999

# TURN REST auth — same shared secret as bench/turna.toml so the
# allocate/channeldata/hold scenarios use identical credentials everywhere.
# STUN binding stays unauthenticated regardless.
use-auth-secret
static-auth-secret=bench-secret

# No quotas, as in bench/turna.toml. These are coturn's defaults, stated so a
# reader does not have to know that.
user-quota=0
total-quota=0

# The relay scenario's peer sockets are on 127.0.0.1, and coturn refuses
# loopback peers by default. turna gets the matching [turn.peer_filter] key.
allow-loopback-peers

# No TLS — the harness is plain UDP.
no-tls
no-dtls

# No telnet CLI: nothing to measure there, and it would hold a port.
no-cli

# Quiet logs — we don't want them affecting wall clock measurements.
no-stdout-log
log-file=/tmp/coturn-bench.log
no-multicast-peers

# Nonce lifetime stays at coturn's default (600 s; turna's is 630 s). This file
# used to say `no-stale-nonce`, which is not an option in either pinned version
# (src/apps/relay/mainrelay.c at tags 4.6.1 and 4.7.0 has `stale-nonce` only).

# Same realm name (cosmetic).
realm=bench

# turna — high-performance TURN server in Rust
# https://github.com/kruatech/turna

[workspace]
resolver = "2"
members = [
    # protocol
    "crates/protocol/proto-stun",
    "crates/protocol/proto-turn",
    "crates/protocol/proto-rtp",
    "crates/rtp-analyzer",
    "crates/crypto",
    "crates/common",

    # core
    "crates/relay",
    "crates/session",
    "crates/auth",
    "crates/qos",
    "crates/config",
    "crates/cluster",
    "crates/transport",
    # DTLS, derived from webrtc-dtls 0.10.0 (MIT OR Apache-2.0) and maintained
    # here. See crates/dtls/src/lib.rs for the origin and the reason.
    "crates/dtls",
    "crates/state-backend",

    # infra
    "crates/health",
    "crates/observability",
    "crates/control",
    "crates/management",

    # binaries
    "services/node",
    "services/control-plane",
    "services/admin",

    # tools
    "tools/turnactl",
    "tools/benchmark",
    "tools/load-test",
    "tools/diff-test",
    "tools/garbage-gen",
    "tools/oauth-verify",

    # tests
    "tests/integration",
    "tests/soak",
]
# fuzz — isolated workspace for cargo-fuzz (as before)
exclude = ["fuzz"]

[workspace.package]
version = "0.5.0"
edition = "2021"
# Minimum supported Rust version. CI builds and tests on exactly this toolchain
# (the `msrv` job; rust-toolchain.toml pins the same channel).
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/kruatech/turna"
homepage = "https://github.com/kruatech/turna"
readme = "README.md"
keywords = ["turn", "stun", "webrtc", "relay", "rfc8656"]
categories = ["network-programming"]
# publish = false removed: crates must be usable as a git dependency
# (crates.io would additionally require a description on each crate)

[workspace.dependencies]
# async runtime / foundation
tokio = { version = "1", features = ["full"] }
bytes = "1"
thiserror = "2"

# serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# STUN/TURN cryptography (RFC 5389/5766: long-term credentials)
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.8"
crc = "3"
rand = "0.10"
base64 = "0.23"

# auth
zeroize = "1"
#
# jsonwebtoken, argon2, password-hash and uuid were declared here for
# turna-auth's store/jwt/user modules, which were deleted in 0.5.0 (they had no
# callers; see docs/OPEN-DECISIONS.md decision 7). Nothing in the workspace names
# them any more, so the entries are gone with the code.
#
# Kept as a note, because both comments recorded a real trap: jsonwebtoken had to
# use aws_lc_rs rather than rust_crypto, since the latter pulls rsa as a bundle
# member and dragged RUSTSEC-2023-0071 (Marvin timing attack, no fixed release)
# into the graph for a crate that only ever used HS256. And password-hash needed
# its `getrandom` feature named explicitly — OsRng was in scope by accident,
# through the old rand, until the rand 0.10 update. If any of these ever comes
# back, it comes back with those two conditions.

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.33"
hostname = "0.3"

# data structures
dashmap = "6"
# Hot-path locks: parking_lot has no poison state, so a panic while holding a
# lock can't cascade into worker-wide crashes via downstream .unwrap().
parking_lot = "0.12"
# Lock-free atomic Arc swap for the single published runtime-config snapshot
# (S4-3): readers load without blocking; a config update swaps the whole
# snapshot in one operation.
arc-swap = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# workspace crates
turna-common        = { path = "crates/common" }
turna-dtls          = { path = "crates/dtls" }
turna-proto-stun    = { path = "crates/protocol/proto-stun" }
turna-proto-turn    = { path = "crates/protocol/proto-turn" }
turna-proto-rtp     = { path = "crates/protocol/proto-rtp" }
turna-rtp-analyzer  = { path = "crates/rtp-analyzer" }
turna-crypto        = { path = "crates/crypto" }
turna-relay         = { path = "crates/relay" }
turna-session       = { path = "crates/session" }
turna-auth          = { path = "crates/auth" }
turna-qos           = { path = "crates/qos" }
turna-config        = { path = "crates/config" }
turna-cluster       = { path = "crates/cluster" }
turna-transport     = { path = "crates/transport" }
turna-state-backend = { path = "crates/state-backend" }
turna-health        = { path = "crates/health" }
turna-observability = { path = "crates/observability" }
turna-control       = { path = "crates/control" }
turna-management    = { path = "crates/management" }

# REMOVED from the original workspace (used only by the SFU/orphans):
#   aes, openssl, tokio-tungstenite, futures-util — verify that the build
#   passes without them; if some crate still pulls them directly via
#   .workspace = true, restore the corresponding line.

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true

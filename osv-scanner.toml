# OSV-Scanner exceptions for the Rust workspace (applies to ./Cargo.lock).
#
# Kept in sync with the [advisories].ignore list in deny.toml. cargo-deny drives
# CI; OSSF Scorecard's Vulnerabilities check reads only this file.
#
# Scope: an osv-scanner.toml applies to manifests in its own directory only and
# does not propagate to child directories.
#
# Only advisories with no upstream remediation path remain here. Anything that
# could be fixed by an upgrade has been fixed instead of ignored.

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
reason = "bincode unmaintained: no upstream path exists. Transitive via webrtc-dtls, and every published webrtc-dtls release through 0.12.0 depends on bincode ^1. The advisory sets patched = [] with no unaffected range, so bincode 2.x/3.x would not clear it either. Recheck when webrtc-rs changes serializer."

# RUSTSEC-2024-0436 (paste) was here and is gone, not silenced: rtnetlink 0.23
# pulls netlink-packet-core 0.9, which has no dependencies, so paste left the
# tree. Removed from deny.toml at the same time — this file states that the two
# are kept in sync, and check-doc-claims.sh now asserts it.

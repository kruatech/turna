[package]
publish = false
name = "turna-relay"
version.workspace = true
edition.workspace = true

[features]
default = []
io-uring = ["turna-transport/io-uring"]
tls = ["turna-transport/tls"]

[dependencies]
libc = "0.2"
tokio.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
turna-proto-stun.workspace = true
turna-proto-turn.workspace = true
turna-proto-rtp.workspace = true
turna-transport.workspace = true
turna-cluster.workspace = true
turna-session.workspace = true
turna-auth.workspace = true
turna-qos.workspace = true
turna-crypto.workspace = true
turna-health.workspace = true
turna-rtp-analyzer.workspace = true

# Concurrency model checking for the nonce-rotation invariant (audit §3).
# Only compiled under `--cfg loom`; never part of a normal build.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

# `loom` is set via RUSTFLAGS (--cfg loom), not a Cargo feature, so teach the
# unexpected_cfgs lint about it (CI builds with -D warnings).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

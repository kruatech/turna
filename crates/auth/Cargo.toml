[package]
publish = false
name = "turna-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.11"

thiserror.workspace = true
tracing.workspace = true
serde.workspace    = true
serde_json.workspace = true
dashmap.workspace  = true
# Lock-free publish of a rotated AuthMode (SIGHUP secret rotation). Already a
# workspace dependency via turna-session, so no new crate enters Cargo.lock.
arc-swap.workspace = true
hmac.workspace     = true
sha1.workspace     = true
base64.workspace   = true
tokio.workspace    = true
# Overwrites key material on drop; see `impl Drop for AuthMode`.
zeroize.workspace  = true
# jsonwebtoken, argon2, password-hash and uuid were removed in 0.5.0 with the
# store/jwt/user modules that were their only consumers. aes-gcm stays: the
# RFC 7635 OAuth path in this file uses it.
# Workspace crates
turna-crypto.workspace    = true
turna-proto-stun.workspace = true

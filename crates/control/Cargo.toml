[package]
publish = false
name    = "turna-control"
version.workspace = true
edition.workspace = true

[dependencies]
tokio.workspace      = true
tracing.workspace    = true
thiserror.workspace  = true
serde.workspace      = true
serde_json.workspace = true
async-trait          = "0.1"
tonic                = { version = "0.12", features = ["tls"] }
prost                = "0.13"
tokio-stream         = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
futures              = "0.3"

# Access to relay engine state
turna-session.workspace  = true
turna-health.workspace   = true
turna-auth.workspace     = true

[build-dependencies]
tonic-build = "0.12"

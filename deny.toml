# cargo-deny configuration for turna-server
# Run: cargo deny check

[graph]
# Resolve the FULL feature graph, not just default features.
#
# Both `ignore` entries below are reachable only through optional features
# (bincode via webrtc-dtls -> `dtls`; paste via rtnetlink -> `af-xdp`). With the
# default graph those crates are absent, so cargo-deny reported
# `advisory-not-detected` for both: the checks were not covering the very builds
# the ignores exist for. cargo-deny resolves the dependency graph without
# compiling, so enabling every feature here is safe even though
# `cargo build --all-features` cannot work (wtransport bundles its own quinn,
# which conflicts with the standalone quinn dep).
all-features = true

targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
# Блокируем уязвимые зависимости.
# Записи в ignore — осознанный техдолг: транзитивные зависимости старых
# стеков (tonic 0.11 / webrtc / rustls 0.22-эпоха), закрываются только
# апгрейдом этих стеков. Убирать записи по мере апгрейдов.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained: no upstream path exists. Transitive via webrtc-dtls, and every published webrtc-dtls release through 0.12.0 depends on bincode ^1. The advisory sets patched = [] with no unaffected range, so bincode 2.x/3.x would not clear it either. Recheck when webrtc-rs changes serializer." },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained: no upstream path exists. Transitive via rtnetlink -> netlink-packet-core; rtnetlink 0.21.0 is the latest release and netlink-packet-core 0.8.1 (also latest) still declares paste ^1 as a non-optional dependency. Recheck when netlink-packet-core migrates to pastey." },
]

[licenses]
# Разрешённые лицензии — только permissive и weak-copyleft
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    # NOTE: "CDLA-Permissive-2.0" (webpki-roots / webpki-root-certs — Mozilla CA
    # store data) was removed: with `all-features = true` over both Linux targets
    # nothing in the graph carries that licence any more, and cargo-deny reported
    # it as an `unused-allowed-license`. A server does not need a client CA store.
    # If a future client-side feature pulls webpki-roots back in, cargo-deny will
    # fail with "license not allowed" — re-add the line then.
]
confidence-threshold = 0.8

# ring имеет нестандартную лицензию — уточняем вручную
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# libxdp-sys (feature `af-xdp` only) declares `LGPL-2.1 OR BSD-2-Clause`.
# `LGPL-2.1` is a DEPRECATED SPDX identifier (current: LGPL-2.1-only /
# LGPL-2.1-or-later), so cargo-deny cannot parse the expression and degrades to a
# warning — which means this crate's licence was effectively NOT being checked.
#
# The expression is a disjunction and we elect the permissive branch,
# BSD-2-Clause, which is already in `allow` above. Recorded in
# docs/COMPLIANCE.md §7 so the election is auditable rather than implicit.
#
# Note this also covers the vendored C libraries (libxdp/libbpf) reached through
# this -sys crate, which carry the same dual licence. `af-xdp` is the only feature
# that pulls an LGPL branch into the graph at all; it is absent from default and
# production builds.
[[licenses.clarify]]
crate = "libxdp-sys"
expression = "BSD-2-Clause"
# cargo-deny 0.19 requires this field to be present. Empty = elect the branch from
# the crate's own declared disjunction without pinning a file hash; unlike `ring`
# above, we are not overriding an unparseable licence, only choosing between two
# the crate already offers.
license-files = [
    # Elects the permissive branch of the crate's own `LGPL-2.1 OR BSD-2-Clause`
    # disjunction by pinning the BSD file it ships. The LGPL-2.1 file is present
    # in the crate and deliberately NOT referenced. See docs/COMPLIANCE.md §7.
    { path = "LICENSE-BSD-2-Clause", hash = 0x00000000 },
]

[licenses.private]
# Не проверяем лицензии наших internal крейтов (publish = false)
ignore = true

[bans]
# Предупреждаем о дублирующихся версиях зависимостей
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Запрещаем известно проблемные крейты
deny = [
    # Старый unmaintained openssl bindings
    { crate = "openssl-sys@0.9.0", reason = "use newer version" },
]

skip = [
    { crate = "getrandom", reason = "ubiquitous 0.2/0.3 split across transitive deps" },
    { crate = "hashbrown", reason = "multiple versions across transitive deps" },
    { crate = "rand", reason = "workspace runtime rand is 0.8; opentelemetry_sdk 0.32 (runtime) and proptest (dev) pull rand 0.9 -- independent, benign" },
    { crate = "rand_chacha", reason = "transitive leaf of the rand 0.8/0.9 split" },
    { crate = "rand_core", reason = "transitive leaf of the rand 0.8/0.9 split (also argon2/password-hash on 0.6)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

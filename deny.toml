# cargo-deny configuration for turna-server
# Run: cargo deny check

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
# Блокируем уязвимые зависимости.
# Записи в ignore — осознанный техдолг: транзитивные зависимости старых
# стеков (tonic 0.11 / webrtc / rustls 0.22-эпоха), закрываются только
# апгрейдом этих стеков. Убирать записи по мере апгрейдов.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa (Marvin timing attack): transitive via webrtc-dtls; no fixed rsa release, closes with webrtc stack upgrade" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained: transitive via old rustls stack; closes with tonic/rustls upgrade" },
    { id = "RUSTSEC-2026-0204", reason = "crossbeam-epoch fmt::Pointer deref: we never Debug/Pointer-format Atomic/Shared; closes with crossbeam upgrade" },
]

[licenses]
# Разрешённые лицензии — только permissive и weak-copyleft
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    # webpki-roots / webpki-root-certs: Mozilla CA store data, permissive data license
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# ring имеет нестандартную лицензию — уточняем вручную
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[licenses.private]
# Не проверяем лицензии наших internal крейтов (publish = false)
ignore = true

[bans]
# Предупреждаем о дублирующихся версиях зависимостей
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Запрещаем известно проблемные крейты
deny = [
    # Старый unmaintained openssl bindings
    { crate = "openssl-sys@0.9.0", reason = "use newer version" },
]

skip = [
    { crate = "getrandom", reason = "ubiquitous 0.2/0.3 split across transitive deps" },
    { crate = "hashbrown", reason = "multiple versions across transitive deps" },
    { crate = "rand", reason = "workspace runtime rand is 0.8; opentelemetry_sdk 0.32 (runtime) and proptest (dev) pull rand 0.9 -- independent, benign" },
    { crate = "rand_chacha", reason = "transitive leaf of the rand 0.8/0.9 split" },
    { crate = "rand_core", reason = "transitive leaf of the rand 0.8/0.9 split (also argon2/password-hash on 0.6)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

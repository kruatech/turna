# cargo-deny configuration for turna-server
# Run: cargo deny check

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
# Блокируем уязвимые зависимости
ignore = [
    # rustls-pemfile unmaintained — transitive via tonic 0.12.3, no fix available yet
    { id = "RUSTSEC-2025-0134", reason = "transitive via tonic 0.12.3, update tonic when available" },
    # webpki name constraints — transitive via tonic 0.12.3
    { id = "RUSTSEC-2026-0098", reason = "transitive via tonic 0.12.3, update tonic when available" },
    { id = "RUSTSEC-2026-0099", reason = "transitive via tonic 0.12.3, update tonic when available" },
    { id = "RUSTSEC-2026-0104", reason = "transitive via tonic 0.12.3, update tonic when available" },
]

[licenses]
# Разрешённые лицензии — только permissive и weak-copyleft
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]
confidence-threshold = 0.8

# ring имеет нестандартную лицензию — уточняем вручную
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[licenses.private]
# Не проверяем лицензии наших internal крейтов (publish = false)
ignore = true

[bans]
# Предупреждаем о дублирующихся версиях зависимостей
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Запрещаем известно проблемные крейты
deny = [
    # Старый unmaintained openssl bindings
    { crate = "openssl-sys@0.9.0", reason = "use newer version" },
]

skip = [
    { crate = "generic-array", reason = "transitive dependency version conflict" },
    { crate = "thiserror", reason = "transitive dependency version conflict v1/v2" },
    { crate = "thiserror-impl", reason = "transitive dependency version conflict v1/v2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

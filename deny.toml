# cargo-deny configuration for turna-server
# Run: cargo deny check

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
# Блокируем уязвимые зависимости
ignore = []

[licenses]
# Разрешённые лицензии — только permissive и weak-copyleft
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
]
confidence-threshold = 0.8

# ring имеет нестандартную лицензию — уточняем вручную
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[licenses.private]
# Не проверяем лицензии наших internal крейтов (publish = false)
ignore = true

[bans]
# Предупреждаем о дублирующихся версиях зависимостей
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Запрещаем известно проблемные крейты
deny = [
    # Старый unmaintained openssl bindings
    { crate = "openssl-sys@0.9.0", reason = "use newer version" },
]

skip = [
    { crate = "thiserror", reason = "transitive dependency version conflict v1/v2" },
    { crate = "thiserror-impl", reason = "transitive dependency version conflict v1/v2" },
    { crate = "getrandom", reason = "ubiquitous 0.2/0.3 split across transitive deps" },
    { crate = "hashbrown", reason = "multiple versions across transitive deps" },
]

skip-tree = [
    { crate = "opentelemetry-otlp", reason = "0.16 brings an older tonic 0.11 / http 0.2 stack; bump planned separately" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

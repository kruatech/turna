version: 2
updates:
  # GitHub Actions. Once the workflows are pinned to commit SHAs (e.g. with
  # `pinact run`), Dependabot bumps both the pinned SHA and the version
  # comment, keeping the supply chain both pinned and current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Default is 5. Five action bumps were open at once (setup-helm,
    # cargo-deny-action, setup-node, attest-build-provenance, action-gh-release),
    # which saturated the queue and silently starved checkout / cache /
    # upload-artifact / download-artifact -- they drifted several majors behind
    # while no PR was ever raised. Matches the cargo entry's limit.
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci

  # Cargo dependencies for the main workspace.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    ignore:
      # API-bound crates: the code targets a specific major. Pre-1.0 crates put
      # breaking changes in the minor position (0.x -> 0.(x+1)), so semver-minor
      # is ignored too, otherwise the ignore has no effect. Patch is allowed.
      - dependency-name: "xsk-rs"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "wtransport"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "webrtc-util"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "webrtc-dtls"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rtnetlink"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "netlink-packet-route"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # RustCrypto moves in lock-step: bump these together, not one at a time.
      - dependency-name: "hmac"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sha1"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "digest"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The fuzz crate is an isolated workspace (excluded from the root one),
  # so Dependabot needs a separate entry to see it.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    commit-message:
      prefix: deps(fuzz)
    ignore:
      - dependency-name: "rand"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sha1"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "hmac"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Base images referenced by deploy/Dockerfile and deploy/Dockerfile.admin.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: deps(docker)
    ignore:
      # Node majors are chosen by hand: only even majors become LTS, and odd
      # ones live about eight months (25 reached end of life on 2026-06-01).
      # Patch and minor bumps of the pinned LTS major still arrive here.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Admin console frontend (Vite/React). Keep the Node major used by
  # `npm ci` in step with deploy/Dockerfile.admin.
  - package-ecosystem: npm
    directory: /services/admin/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps(frontend)
    groups:
      frontend-dev:
        dependency-type: development

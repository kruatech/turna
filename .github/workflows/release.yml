name: release

# Cut a release on a version tag: build and publish a multi-arch container
# image to GHCR, build standalone linux/amd64 binaries, and create a GitHub
# Release with the binaries, checksums, and auto-generated notes.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release and upload assets
  packages: write # push the image to GHCR

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/<repo>, e.g. ghcr.io/kruatech/turna
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Multi-arch container image -> GHCR (no external secrets; uses GITHUB_TOKEN).
  #
  # NOTE: the linux/arm64 leg builds under QEMU emulation, which is slow for a
  # Rust release build. If it becomes too slow or times out, either drop arm64
  # from `platforms` below, or move this job to a native arm64 runner
  # (`runs-on: ubuntu-24.04-arm`) with a per-arch matrix.
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ---------------------------------------------------------------------------
  # Standalone linux/amd64 binaries -> tar.gz + SHA256. The container image
  # above already covers arm64 users; cross-compiling standalone arm64 binaries
  # is left as a follow-up.
  # ---------------------------------------------------------------------------
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libclang-dev pkg-config protobuf-compiler

      - name: Build release binaries
        run: |
          cargo build --locked --release \
            --bin turna-node \
            --bin turna-control-plane \
            --bin turnactl

      - name: Package binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PKG="turna-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${PKG}"
          cp target/release/turna-node \
             target/release/turna-control-plane \
             target/release/turnactl \
             "dist/${PKG}/"
          cp README.md LICENSE "dist/${PKG}/" 2>/dev/null || true
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          ( cd dist && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256" )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/*.tar.gz*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Create the GitHub Release once both builds succeed.
  # ---------------------------------------------------------------------------
  release:
    needs: [docker, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
          body: |
            Container image (linux/amd64, linux/arm64):
            `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`

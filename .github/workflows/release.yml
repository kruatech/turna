name: release

# Cut a release on a version tag: build and publish a multi-arch container
# image to GHCR (cosign-signed, with SLSA provenance + SBOM attestations),
# build standalone linux/amd64 binaries and .deb/.rpm packages with checksums +
# SBOM + provenance, and create a GitHub Release.
on:
  push:
    tags:
      - "v*"

# Least privilege at the top; each job elevates only what it needs.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/<repo>, e.g. ghcr.io/kruatech/turna
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Multi-arch container image -> GHCR (no external secrets; uses GITHUB_TOKEN
  # and OIDC keyless signing). The image is signed by digest with cosign and
  # carries SLSA provenance + SBOM attestations.
  #
  # NOTE: the linux/arm64 leg builds under QEMU emulation, which is slow for a
  # Rust release build. If it becomes too slow or times out, either drop arm64
  # from `platforms`, or move to a native arm64 runner with a per-arch matrix.
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout
      packages: write      # push image to GHCR
      id-token: write      # keyless cosign + provenance (OIDC)
      attestations: write  # build-provenance / SBOM attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: imagetags
        run: |
          REF="${GITHUB_REF_NAME}"
          REPO="${REGISTRY}/${IMAGE_NAME}"
          tags="${REPO}:${REF}"
          # Only a final (non-prerelease) tag moves :latest. Prerelease tags
          # (containing a hyphen, e.g. v0.2.0-alpha.1) do not.
          case "$REF" in
            *-*) ;;
            *)  tags="${tags}"$'\n'"${REPO}:latest" ;;
          esac
          { echo "tags<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # BuildKit attaches SLSA provenance and an SBOM to the image in GHCR.
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.imagetags.outputs.tags }}

      - name: Sign image (keyless, by digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Attest build provenance (GitHub, pushed to registry)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ---------------------------------------------------------------------------
  # Admin image (UI + bridge) -> GHCR as <repo>-admin. Mirrors the `docker` job:
  # multi-arch, keyless cosign signing by digest, SLSA provenance + SBOM.
  # ---------------------------------------------------------------------------
  docker-admin:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ github.repository }}-admin
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: imagetags
        run: |
          REF="${GITHUB_REF_NAME}"
          REPO="${REGISTRY}/${IMAGE_NAME}"
          tags="${REPO}:${REF}"
          case "$REF" in
            *-*) ;;
            *)  tags="${tags}"$'\n'"${REPO}:latest" ;;
          esac
          { echo "tags<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.admin
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.imagetags.outputs.tags }}

      - name: Sign image (keyless, by digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Attest build provenance (GitHub, pushed to registry)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ---------------------------------------------------------------------------
  # Standalone linux/amd64 binaries -> tar.gz + SHA256 + SBOM + provenance.
  # The container image above covers arm64 users; cross-compiling standalone
  # arm64 binaries is left as a follow-up.
  # ---------------------------------------------------------------------------
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout
      id-token: write      # provenance attestation (OIDC)
      attestations: write  # build-provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libclang-dev pkg-config protobuf-compiler

      - name: Build release binaries
        run: |
          # Strip the build directory out of the binary. Panic messages and debug
          # info otherwise carry the absolute path, so the same source built in
          # /home/runner/work/turna and /build produces different bytes — and a
          # user checking the published binary against the published source
          # cannot, which is the whole point of the property.
          #
          # Set here rather than in an `env:` block: Actions assigns env values
          # literally, so a `$HOME` there would reach rustc as four characters.
          export RUSTFLAGS="--remap-path-prefix=$PWD= --remap-path-prefix=$HOME/.cargo="
          # Honoured by build scripts that stamp a date. Deterministic per commit
          # rather than per build.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cargo build --locked --release \
            --bin turna-node \
            --bin turna-control-plane \
            --bin turnactl

      - name: Package binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PKG="turna-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${PKG}"
          cp target/release/turna-node \
             target/release/turna-control-plane \
             target/release/turnactl \
             "dist/${PKG}/"
          cp README.md LICENSE NOTICE "dist/${PKG}/" 2>/dev/null || true
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          ( cd dist && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256" )

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/turna-${{ github.ref_name }}.spdx.json

      - name: Attest binary provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.spdx.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # linux/amd64 .deb and .rpm for turna-node -> SHA256 + SBOM + provenance,
  # the same evidence the tarballs carry.
  #
  # Metadata lives in services/node/Cargo.toml ([package.metadata.deb] and
  # [package.metadata.generate-rpm]). Both tools are installed with
  # `cargo install --locked --version <exact>`: a pinned crate version with its
  # own lockfile, rather than an action or a downloaded binary. Neither needs
  # rpmbuild or a spec file.
  # ---------------------------------------------------------------------------
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout
      id-token: write      # provenance attestation (OIDC)
      attestations: write  # build-provenance attestation
    env:
      CARGO_DEB_VERSION: 3.8.0
      CARGO_GENERATE_RPM_VERSION: 0.21.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # dpkg-dev: dpkg-shlibdeps for cargo-deb's $auto depends.
          # rpm: only to inspect the built package below.
          sudo apt-get install -y --no-install-recommends \
            cmake libclang-dev pkg-config protobuf-compiler dpkg-dev rpm

      - name: Install packaging tools (pinned)
        run: |
          cargo install --locked cargo-deb --version "${CARGO_DEB_VERSION}"
          cargo install --locked cargo-generate-rpm --version "${CARGO_GENERATE_RPM_VERSION}"

      - name: Build release binary
        run: |
          # Same reproducibility flags as the `binaries` job; see there.
          export RUSTFLAGS="--remap-path-prefix=$PWD= --remap-path-prefix=$HOME/.cargo="
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cargo build --locked --release -p turna-node

      - name: Build .deb
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p dist
          # --no-build: package the binary built above (cargo-deb strips it).
          cargo deb --no-build --locked -p turna-node --output dist/

      - name: Build .rpm
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          # cargo-generate-rpm packages the file as it is; cargo-deb stripped
          # its own copy, so strip here for the same payload.
          strip -s target/release/turna-node
          cargo generate-rpm -p services/node -o dist/

      - name: Inspect packages
        run: |
          set -euo pipefail
          deb=$(ls dist/*.deb); rpm=$(ls dist/*.rpm)
          dpkg-deb --info "$deb"
          dpkg-deb -c "$deb" | tee deb-contents.txt
          for f in ./usr/bin/turna-node ./etc/turna/turn.toml \
                   ./usr/lib/systemd/system/turna-node.service \
                   ./usr/lib/systemd/system/turna-node.service.d/10-package.conf \
                   ./usr/lib/sysctl.d/99-turna.conf ./usr/lib/sysusers.d/turna-node.conf; do
            grep -q " ${f}\$" deb-contents.txt || { echo "::error::.deb is missing ${f}"; exit 1; }
          done
          dpkg-deb -e "$deb" debctl
          grep -qx '/etc/turna/turn.toml' debctl/conffiles
          grep -q 'systemd-sysusers' debctl/postinst
          rpm -qpl "$rpm" | tee rpm-contents.txt
          for f in /usr/bin/turna-node /etc/turna/turn.toml \
                   /usr/lib/systemd/system/turna-node.service \
                   /usr/lib/systemd/system/turna-node.service.d/10-package.conf \
                   /usr/lib/sysctl.d/99-turna.conf /usr/lib/sysusers.d/turna-node.conf; do
            grep -qx "$f" rpm-contents.txt || { echo "::error::.rpm is missing ${f}"; exit 1; }
          done
          rpm -qp --configfiles "$rpm" | grep -qx /etc/turna/turn.toml
          # cargo-generate-rpm takes a script path that does not exist as the
          # script TEXT, so check the scriptlets really are the files' contents.
          rpm -qp --scripts "$rpm" | tee rpm-scripts.txt
          grep -q 'useradd -r' rpm-scripts.txt
          grep -q 'systemctl daemon-reload' rpm-scripts.txt

      - name: Checksums
        run: |
          cd dist
          for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/turna-node-packages-${{ github.ref_name }}.spdx.json

      - name: Attest package provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
            dist/*.spdx.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Create the GitHub Release once every build succeeds.
  # ---------------------------------------------------------------------------
  release:
    needs: [docker, docker-admin, binaries, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release and upload assets
    steps:
      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-binaries
          path: dist

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-packages
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
            dist/*.spdx.json
          body: |
            Container image (linux/amd64, linux/arm64):
            `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`

            ## Supply chain

            The image is **cosign-signed** (keyless) and carries SLSA
            provenance + SBOM attestations. Verify:

            ```
            cosign verify ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

            Binary tarballs ship with `.sha256` checksums and an SPDX SBOM
            (`*.spdx.json`), plus a GitHub build-provenance attestation.

            ## Packages (linux/amd64)

            `turna-node_*.deb` (Debian/Ubuntu) and `turna-node-*.rpm`
            (Fedora/RHEL family) install the node binary, a hardened systemd
            unit (**not enabled or started** — edit `/etc/turna/turn.toml`
            first), the config as a conffile, a sysctl drop-in and the
            `turna` system user. See docs/DEPLOY.md. Each has a `.sha256`
            and a build-provenance attestation:

            ```
            sha256sum -c turna-node_*.deb.sha256
            gh attestation verify turna-node_*.deb --repo ${{ github.repository }}
            ```

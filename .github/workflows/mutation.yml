name: mutation tests

on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: "Per-mutant timeout in seconds"
        required: false
        default: "60"
      jobs:
        description: "cargo-mutants parallel jobs"
        required: false
        default: "2"
  schedule:
    # Weekly signal without turning every PR into a long mutation run.
    - cron: "41 2 * * 1"

permissions:
  contents: read

jobs:
  proto-stun-mutants:
    name: cargo-mutants proto-stun parser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MUTANTS_TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds || '60' }}
      MUTANTS_JOBS: ${{ github.event.inputs.jobs || '2' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run proto-stun mutation tests
        run: scripts/ci/mutants_proto_stun.sh

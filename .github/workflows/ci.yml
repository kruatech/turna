name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Test credentials for the auth suite, which reads them from the environment
  # rather than holding literals in its source. Not secrets: they exist only for
  # the tests and appear in no build artifact. Mirrored in .env.test.
  TURNA_TEST_PW_V1: password123
  TURNA_TEST_PW_V2: pass12345
  TURNA_TEST_PW_T1: hunter2
  TURNA_TEST_PW_T2: pw
  # Deliberately too short: the test asserts it is refused.
  TURNA_TEST_PW_TOOSHORT: abc
  # Deliberately invalid nonce inputs, and a documentation address. Not secrets —
  # they are the bad values the tests assert are rejected.
  TURNA_TEST_BAD_NONCE_GARBLED: not-a-nonce
  TURNA_TEST_BAD_NONCE_NOTHEX: "zz:zz"
  TURNA_TEST_BAD_NONCE_EMPTY: ""
  TURNA_TEST_CLIENT_ID: c
  TURNA_TEST_PEER_ADDR: "203.0.113.7:51000"
  TURNA_TEST_NONCE_TS: "1234"
  TURNA_TEST_KEY_K1: "17"
  TURNA_TEST_KEY_K2: "66"
  TURNA_TEST_KEY_K3: "55"
  TURNA_TEST_KEY_K4: "0"
  TURNA_TEST_PW_T3: correct-pass
  TURNA_TEST_PW_T4: wrong-pass
  TURNA_TEST_NONCE_SECRET: test-secret
  TURNA_TEST_PASS: testpass
  TURNA_TEST_WRONG_PW: definitely-wrong-password
  TURNA_TEST_TURN_SECRET: turna-secret

# Least privilege: every CI job only reads the repository contents.
# No CI job needs write access to anything.
permissions:
  contents: read


jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Use the repository's pinned release toolchain for deterministic fmt,
      # Clippy, build and test results. A floating `stable` changed rustfmt/lint
      # behaviour independently of the source revision and broke otherwise
      # reproducible CI.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install build dependencies (protoc for prost-build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: msrv (pinned 1.95.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Enforce the pinned/reproducible-build toolchain on every PR/push, not
      # only at release-tag time. The release `binaries` job builds on 1.95.0,
      # but it runs only on `v*` tags, so without this nothing proves a PR still
      # compiles + tests under the pinned channel. --locked also proves the
      # committed Cargo.lock is consistent.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libclang-dev pkg-config protobuf-compiler
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --exclude turna-dtls
      # turna-dtls separately, single-threaded: its tests stand up real UDP
      # sockets and share a process-wide crypto provider, so in parallel they
      # fail each other — 62 pass one at a time, 17 fail together. Inherited
      # from webrtc-dtls; the interference is in the test suite, not the code.
      - run: cargo test -p turna-dtls --locked -- --test-threads=1

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libclang-dev pkg-config protobuf-compiler
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf
      - run: cargo build --workspace --locked
      - name: cargo test workspace
        env:
          TURNA_TEST_REQUIRE_SERVER: "1"
        run: cargo test --workspace --locked --exclude turna-dtls
      # turna-dtls separately, single-threaded: its tests stand up real UDP
      # sockets and share a process-wide crypto provider, so in parallel they
      # fail each other — 62 pass one at a time, 17 fail together. Inherited
      # from webrtc-dtls; the interference is in the test suite, not the code.
      - run: cargo test -p turna-dtls --locked -- --test-threads=1

  integration-hermetic:
    name: integration tests (hermetic turna-node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # Build the node binary explicitly: the hermetic integration harness looks
      # for target/<profile>/turna-node and then starts it on ephemeral ports.
      - name: Install protoc (turna-control build.rs)
        # turna-node depends on turna-control, whose build.rs compiles
        # management.proto through prost-build. Every job that builds the node
        # needs protoc; this one did not have it.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          else
            brew list protobuf >/dev/null 2>&1 || brew install protobuf
          fi
      - run: cargo build -p turna-node --locked
      - name: Run TURN integration tests against hermetic node
        env:
          TURNA_TEST_REQUIRE_SERVER: "1"
        run: cargo test -p turna-integration-tests --locked -- --nocapture

  all-features-linux:
    name: check workspace --all-features (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # `--all-features` enables the Linux-only AF_XDP dependency graph.
      # libxdp-sys/libbpf-sys need these native build inputs even for
      # `cargo check`; runtime AF_XDP tests still require real NIC/kernel setup
      # and are intentionally not run here.
      - name: Install AF_XDP native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libelf-dev linux-libc-dev zlib1g-dev libpcap-dev pkg-config make \
            protobuf-compiler
      - run: cargo check --workspace --all-targets --all-features --locked

  feature-matrix:
    name: check ${{ matrix.package }}:${{ matrix.features }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-platform transport surfaces. Run them on Linux and macOS so
          # target-gating mistakes are caught before merge.
          - os: ubuntu-latest
            package: turna-node
            features: tls
          - os: macos-latest
            package: turna-node
            features: tls
          - os: ubuntu-latest
            package: turna-node
            features: dtls
          - os: macos-latest
            package: turna-node
            features: dtls
          - os: ubuntu-latest
            package: turna-node
            features: quic
          - os: macos-latest
            package: turna-node
            features: quic
          - os: ubuntu-latest
            package: turna-node
            features: web-transport
          - os: macos-latest
            package: turna-node
            features: web-transport

          # Linux-only datapaths. These are compile gates only; io_uring and
          # AF_XDP runtime coverage belongs to dedicated Linux/hardware jobs.
          - os: ubuntu-latest
            package: turna-node
            features: io-uring
          - os: ubuntu-latest
            package: turna-node
            features: af-xdp
          - os: ubuntu-latest
            package: turna-transport
            features: io-uring
          - os: ubuntu-latest
            package: turna-transport
            features: af-xdp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install protoc for the feature matrix
        # turna-node depends on turna-control, whose build.rs compiles
        # management.proto through prost-build. That dependency is new — the node
        # gained it for AuditLog and InfraEvent — so this step is too. Five other
        # jobs already install protoc; this matrix was the one that did not, and
        # every turna-node entry in it failed on "Could not find protoc".
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          else
            brew install protobuf
          fi
      - name: Install AF_XDP native build dependencies
        if: runner.os == 'Linux' && contains(matrix.features, 'af-xdp')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libelf-dev linux-libc-dev zlib1g-dev libpcap-dev pkg-config make
      - name: cargo check selected feature
        run: cargo check -p ${{ matrix.package }} --all-targets --features ${{ matrix.features }} --locked

  tls-fail-closed:
    name: '[tls] enabled on a build without the feature must refuse to start'
    runs-on: ubuntu-latest
    # The matrix above proves the node COMPILES with `tls`. This proves the other
    # half: that a binary built without it refuses a config that asks for TURNS,
    # instead of starting, logging a clean start, and serving nothing on 5349.
    # That was the actual failure mode — the image built without `--features tls`
    # while `EXPOSE 5349/tcp` and deploy/examples/corporate.toml both said the
    # port was live. DTLS and QUIC had this guard from the start; TLS did not.
    #
    # `--no-default-features` is how you get such a binary now that `tls` is a
    # default feature, so this job also pins that default in place: move `tls`
    # out of `default` and the guard is all that stands between an operator and a
    # silent UDP-only node.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install protoc (turna-control build.rs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
      - name: Build the node without default features
        run: cargo build -p turna-node --bin turna-node --no-default-features --locked
      - name: A config asking for TURNS must be refused
        run: |
          set -uo pipefail
          cat > /tmp/tls-without-feature.toml <<'TOML'
          [turn]
          listen = "127.0.0.1:33478"

          [turn.auth]
          shared_secret = "ci-secret-not-the-placeholder"

          [tls]
          enabled = true
          listen = "127.0.0.1:35349"
          TOML
          # The guard runs before any socket is bound, so this exits without
          # touching the ports above.
          set +e
          out=$(./target/debug/turna-node /tmp/tls-without-feature.toml 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::the node started with [tls] enabled on a binary built without the feature — port 5349 would be advertised and never served"
            exit 1
          fi
          # Exiting non-zero is not enough: it must fail for THIS reason, with the
          # rebuild instruction. A config error unrelated to TLS would otherwise
          # let this job pass while the guard was gone.
          if ! printf '%s' "$out" | grep -q -- '--features tls'; then
            echo "::error::the node refused the config, but not with the TURNS guard's message — check the [tls] fail-fast in services/node/src/main.rs"
            exit 1
          fi
          echo "refused as expected (exit $code)"

  packaging:
    name: docker + helm packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.15.4
      - name: Install protoc (turna-control build.rs)
        # turna-node depends on turna-control, whose build.rs compiles
        # management.proto through prost-build. Every job that builds the node
        # needs protoc; this one did not have it.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          else
            brew list protobuf >/dev/null 2>&1 || brew install protobuf
          fi
      - name: Helm lint
        run: helm lint deploy/helm/turna
      - name: Render Helm config and parse with turna-config
        run: |
          helm template turna deploy/helm/turna > /tmp/turna-rendered.yaml
          python3 scripts/extract_helm_config.py /tmp/turna-rendered.yaml /tmp/turn.toml
          TURNA_SHARED_SECRET=ci-smoke-secret TURNA_CONFIG_TEST_FILE=/tmp/turn.toml \
            cargo test -p turna-config external_config_file_parses_when_requested -- --test-threads=1
      - name: Parse the scenario example configs with turna-config
        # The audit asked for worked examples (public / corporate / cluster). An
        # example config that does not load is worse than none: it is copied,
        # edited, and the failure is blamed on the edit. Each is loaded through
        # the real validator with `production = true`, which is the strict branch
        # — placeholder-secret refusal, the unlimited-bandwidth rule, cluster mode
        # requiring a shared backend, a non-loopback management listener.
        run: |
          set -euo pipefail
          # A shell glob rather than `ls`: `ls` on a glob matching nothing exits
          # 2, and under pipefail that killed the step before the check below
          # could run — so the message never printed and the job failed bare.
          shopt -s nullglob
          examples=(deploy/examples/*.toml)
          found=${#examples[@]}
          if [ "$found" -eq 0 ]; then
            echo "::error::no example configs found in deploy/examples/ — refusing to report a clean check"
            exit 1
          fi
          # Absolute path: `cargo test -p turna-config` runs from the crate
          # directory, so a repo-relative path is looked up under crates/config
          # and the file is simply not there. The Helm step above passes
          # /tmp/turn.toml and never hit this.
          for f in "${examples[@]}"; do
            echo "::group::$f"
            TURNA_EXTERNAL_IP=203.0.113.10 \
            TURNA_SHARED_SECRET=ci-example-secret-not-the-placeholder \
            TURNA_PREVIOUS_SHARED_SECRET= \
            TURNA_USER_BRIDGE_PASSWORD=ci-bridge-pw \
            TURNA_USER_PHONES_PASSWORD=ci-phones-pw \
            TURNA_NODE_ID=ci-node-0 \
            TURNA_GOSSIP_ADVERTISE=10.0.0.1:7946 \
            TURNA_CLUSTER_SECRET=ci-cluster-secret \
            TURNA_BACKEND_URI=127.0.0.1:3301 \
            TURNA_BACKEND_PASSWORD=ci-backend-pw \
            TURNA_CONFIG_TEST_FILE="$PWD/$f" \
              cargo test -p turna-config external_config_file_parses_when_requested -- --test-threads=1
            echo "::endgroup::"
          done
          echo "parsed $found example config(s)"
      - name: Render production-example Helm config and parse it too
        # values-production.example.yaml was rendered only for kubeconform, which
        # validates Kubernetes schema and knows nothing about turn.toml. So the
        # file operators are told to copy produced a config that nothing ever
        # parsed, and `production = true` is exactly the branch the default render
        # does not exercise: placeholder-secret refusal, the unlimited-bandwidth
        # rule, write_behind-on-memory, a non-loopback management listener.
        run: |
          helm template turna deploy/helm/turna \
            -f deploy/helm/turna/values-production.example.yaml \
            > /tmp/turna-rendered-prod.yaml
          python3 scripts/extract_helm_config.py /tmp/turna-rendered-prod.yaml /tmp/turn-prod.toml
          TURNA_SHARED_SECRET=ci-smoke-secret TURNA_CONFIG_TEST_FILE=/tmp/turn-prod.toml \
            cargo test -p turna-config external_config_file_parses_when_requested -- --test-threads=1
      - name: Docker build
        run: docker build -f deploy/Dockerfile -t turna:ci .
      - name: Docker build (admin)
        # Build the admin image in ordinary CI so a Dockerfile.admin error is
        # caught on every push/PR, not only at tag release (release.yml's
        # docker-admin job). Admin is now a required release artifact.
        run: docker build -f deploy/Dockerfile.admin -t turna-admin:ci .
      - name: Admin container smoke
        run: |
          set -euo pipefail
          name=turna-admin-ci-smoke
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$name" -p 18080:8080 \
            -e TURNA_ADMIN_LISTEN=0.0.0.0:8080 \
            -e TURNA_ADMIN_AUTH_TOKEN=ci-admin-token \
            -e TURNA_ADMIN_GRPC_ADDR=http://127.0.0.1:5350 \
            turna-admin:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' "$name" | grep -qx true; then
              docker logs "$name"
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz >/dev/null
          curl -fsS http://127.0.0.1:18080/ >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"command":"ping","params":{}}' \
            http://127.0.0.1:18080/api/manage)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'x-admin-token: ci-admin-token' \
            -d '{"command":"ping","params":{}}' \
            http://127.0.0.1:18080/api/manage)" = 502
          docker stop -t 10 "$name" >/dev/null
          test "$(docker inspect -f '{{.State.ExitCode}}' "$name")" = 0

  frontend:
    name: admin frontend build (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SHA-pinned to match the repo's pinned-actions policy. Resolve/update with:
      #   git ls-remote https://github.com/actions/setup-node refs/tags/v4
      # Node major aligned with deploy/Dockerfile.admin (node:22) so the frontend
      # CI job and the real container build share one toolchain.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # This is the contour that catches admin TypeScript <-> backend contract
      # drift before release. Requires services/admin/frontend/package-lock.json
      # to be committed (npm ci refuses to run without it).
      - name: Install and build admin frontend
        working-directory: services/admin/frontend
        run: |
          npm ci
          npm run build

  deny:
    name: cargo-deny (лицензии, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  fuzz-build:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: fuzz
      - name: Install protoc (turna-control build.rs)
        # turna-node depends on turna-control, whose build.rs compiles
        # management.proto through prost-build. Every job that builds the node
        # needs protoc; this one did not have it.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          else
            brew list protobuf >/dev/null 2>&1 || brew install protobuf
          fi
      - run: cargo install cargo-fuzz
      - run: cd fuzz && cargo +nightly fuzz build
      # короткий smoke-прогон каждой цели, 30 секунд
      - run: |
          cd fuzz
          # Derived from the manifest, not hardcoded. The list used to be five
          # names written out here, so a new fuzz target got built by the step
          # above and never smoke-run by this one — silently, because nothing
          # compared the two. The guard also refuses an empty list: a green run
          # that fuzzed nothing is worse than a red one.
          targets="$(cargo +nightly fuzz list)"
          found=$(printf '%s\n' "$targets" | grep -c '[^[:space:]]' || true)
          declared=$(grep -c '^\[\[bin\]\]' Cargo.toml)
          echo "targets: found=$found declared=$declared"
          if [ "$found" -eq 0 ] || [ "$found" -ne "$declared" ]; then
            echo "::error::cargo fuzz list found $found target(s), Cargo.toml declares $declared"
            exit 1
          fi
          ran=0
          for t in $targets; do
            cargo +nightly fuzz run "$t" -- -max_total_time=30
            ran=$((ran + 1))
          done
          echo "smoke-ran $ran target(s)"
          [ "$ran" -eq "$declared" ]

  miri:
    name: miri (UB in pure-memory unsafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Miri takes hours on its abstract machine, and it only ever runs two crates —
      # both pure parsing. A change that touches neither cannot alter what it would
      # find, so documentation, scripts and Dockerfiles skip it rather than paying
      # for a result that is decided in advance.
      #
      # Deliberately generous: the whole workspace manifest and lockfile count, since
      # a dependency bump can change what those crates compile to.
      - name: does this change reach the crates Miri covers?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
          CHANGED=$(git diff --name-only "$BASE...HEAD" || echo "")
          if [ -z "$CHANGED" ]; then
            echo "could not diff against $BASE — running Miri rather than guessing"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$CHANGED" | grep -qE '^(crates/protocol/proto-stun/|crates/packet/|Cargo\.lock$|Cargo\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skipped: nothing under the crates Miri covers changed"
          fi
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        if: steps.scope.outputs.run == 'true'
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: steps.scope.outputs.run == 'true'
      # Miri executes tests on its abstract machine and flags UB and data races
      # in unsafe code. It runs only on crates whose unsafe is pure-memory
      # (parsing / packet manipulation). The transport datapath's unsafe is
      # syscall-bound (mmap/io_uring/AF_XDP) and cannot run under Miri — it is
      # covered by the hardware soak/bench instead.
      - name: cargo miri test
        if: steps.scope.outputs.run == 'true'
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: |
          cargo +nightly miri test -p turna-proto-stun -p turna-packet

  loom:
    name: loom (lock-free concurrency model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # Loom exhaustively explores thread interleavings for the lock-free
      # primitives. Gated behind --cfg loom so it is never part of a normal
      # build. LOOM_MAX_PREEMPTIONS bounds the state space for CI wall-clock.
      - name: Install protoc (turna-control build.rs)
        # turna-node depends on turna-control, whose build.rs compiles
        # management.proto through prost-build. Every job that builds the node
        # needs protoc; this one did not have it.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          else
            brew list protobuf >/dev/null 2>&1 || brew install protobuf
          fi
      - name: cargo test --cfg loom
        env:
          LOOM_MAX_PREEMPTIONS: "3"
        run: |
          RUSTFLAGS="--cfg loom" cargo test -p turna-qos --lib loom_bucket

  failover-integration:
    name: failover (Tarantool CAS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # Provision Tarantool with the turna schema + stored functions, then run
      # the backend failover/CAS integration tests against it. The tests skip
      # themselves when TARANTOOL_URI is unset (so the cross-platform `test`
      # job above stays backend-free); this job is the one place they execute.
      #
      # ADJUST TO YOUR DEPLOYMENT:
      #  * Image tag: pin to the Tarantool major you target (2 vs 3).
      #  * `deploy/tarantool/init.lua` must, when run as the instance script,
      #    call box.cfg{listen=3301}, create the schema/functions, and keep the
      #    instance running. If your init.lua is meant to be applied to an
      #    already-listening instance instead, start a vanilla instance here and
      #    pipe the script in via `tt connect`/console rather than as the entrypoint.
      #  * Auth: if init.lua provisions the `turna_app` role with a password,
      #    set TARANTOOL_USER / TARANTOOL_PASSWORD below to match.
      - name: Install protoc (turna-control build.rs)
        # turna-node depends on turna-control, whose build.rs compiles
        # management.proto through prost-build. Every job that builds the node
        # needs protoc; this one did not have it.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          else
            brew list protobuf >/dev/null 2>&1 || brew install protobuf
          fi
      - name: Start Tarantool with turna schema
        run: |
          docker run -d --name turna-tnt -p 3301:3301 \
            -e TURNA_PASSWORD=turna \
            -v "$PWD/deploy/tarantool:/opt/turna:ro" \
            tarantool/tarantool:2 tarantool /opt/turna/init.lua
          echo "waiting for iproto on :3301"
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/3301) 2>/dev/null; then
              echo "tarantool is up"; exec 3>&- ; break
            fi
            sleep 1
          done
      - name: Run the Tarantool stored-procedure test suites
        # Three Lua suites pin the CAS semantics the failover claim depends on:
        # migration idempotency, the exact-u64 parser, and the runtime /
        # user-limits CAS round-trip including rollback on an injected write
        # failure. GA_FINAL_REPORT.md documented how to run them by hand, and
        # nothing ever did — so the contract they pin was unenforced, in the one
        # place where getting CAS wrong loses allocations silently.
        #
        # A separate throwaway container on purpose: init.lua calls
        # box.cfg{listen=3301} as the instance script, and the container above is
        # already listening on it. Each suite ends with
        # `os.exit(test:check() and 0 or 1)`, so a failure fails this step —
        # checked before wiring it up, because a suite that prints FAIL and exits
        # 0 would have made this a green step that proves nothing.
        run: |
          set -euo pipefail
          expected=$(ls deploy/tarantool/tests/*_test.lua | wc -l | tr -d ' ')
          [ "$expected" -gt 0 ] || { echo "::error::no *_test.lua found"; exit 1; }
          ran=0
          for t in deploy/tarantool/tests/*_test.lua; do
            name=$(basename "$t")
            echo "::group::$name"
            # --entrypoint: the image's ENTRYPOINT is docker-entrypoint.sh with
            # CMD tarantool, and it treats its first argument as a script path.
            # `tarantool -e "..."` therefore reached the binary as two file
            # names and died with `cannot open -e`, so this step had never run a
            # single suite. Calling the binary directly passes -e through.
            docker run --rm --entrypoint tarantool -e TURNA_PASSWORD=turna \
              -v "$PWD/deploy/tarantool:/opt/turna:ro" \
              tarantool/tarantool:2 \
              -e "dofile('/opt/turna/init.lua'); dofile('/opt/turna/tests/${name}')"
            ran=$((ran + 1))
            echo "::endgroup::"
          done
          echo "lua suites run: $ran of $expected"
          [ "$ran" -eq "$expected" ]
      - name: Run backend + failover integration tests
        env:
          TARANTOOL_URI: 127.0.0.1:3301
          TARANTOOL_USER: turna
          TARANTOOL_PASSWORD: turna
        run: cargo test -p turna-state-backend integration_ -- --test-threads=1 --nocapture
      - name: Tarantool logs (on failure)
        if: failure()
        run: docker logs turna-tnt || true

  # ── End-to-end gate for the QUIC / WebTransport datapath ────────────────────
  # The feature-matrix job above only runs `cargo check` on `quic` and
  # `web-transport`: it proves they compile, not that a byte ever crosses the
  # relay. That gap is why this job exists. `scripts/verify/transports.sh`
  # starts a real node, generates a self-signed EC certificate, and drives the
  # load tool's `quic-check` and `wt-check` probes, each of which ends at
  # relayed media arriving on the far side — not at a success response.
  #
  # PHASES includes native Linux SCTP. Dropping the variable runs
  # the full matrix (udp, turns, dtls too), which is what you want locally and
  # too slow to put on every PR.
  #
  # NOTE: `wt-check` is not a browser. Client and server share `wtransport` and
  # one reading of the spec, so a shared misreading stays invisible here. Browser
  # evidence lives in docs/interop/webtransport-browser-2026-08-20.md and has to
  # be refreshed by hand.
  transport-e2e:
    name: e2e (QUIC + WebTransport + SCTP)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install protoc (turna-control build.rs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
      - name: Require native SCTP kernel support
        run: |
          sudo modprobe sctp
          python3 scripts/verify/transport-observe.py sctp
      - name: QUIC + WebTransport + SCTP end-to-end
        env:
          PHASES: quic wt sctp
          OUT: transport-e2e
        run: bash scripts/verify/transports.sh
      - name: Transport lifecycle, admission and backpressure
        env:
          PHASES: quic wt sctp
          CYCLES: "2"
          CRASH_ROUNDS: "1"
          HEALTH_PORT: "19096"
          OUT: transport-lifecycle-e2e
        run: python3 scripts/verify/transport-lifecycle.py
      - name: Upload logs
        # Always: a passing run's node logs are the baseline you compare the next
        # failure against, and this harness writes everything to files rather
        # than stdout.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transport-e2e-logs
          path: |
            transport-e2e/
            transport-lifecycle-e2e/
          retention-days: 14

  # ── P0 §7.3 / §24: deployment consistency gate ──────────────────────────────
  # Fails the build if the relay UDP port range diverges across turn.toml,
  # docker-compose, and the Helm values — the exact class of drift that let
  # allocations succeed while their relay traffic was silently dropped (P0 #13).
  deploy-consistency:
    name: deploy consistency (release + relay range)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check relay range agrees across turn.toml / compose / helm
        run: bash scripts/check-deploy-consistency.sh

  # ── P0 §7.3 / §24: Helm chart render + schema validation ────────────────────
  # `helm lint` + `helm template` (default AND production-example values) piped
  # through kubeconform (offline k8s-schema validation, no cluster). Catches
  # malformed manifests before they reach a cluster. NOTE: kubeconform validates
  # structure/schema, not semantic policy (e.g. hostPort collisions) — those are
  # covered by the production values' required podAntiAffinity, not by this gate.
  helm-validate:
    name: offline manifest + rule validation (helm, kubeconform, promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install helm + kubeconform (pinned)
        run: |
          set -euo pipefail
          HELM_VER=v3.16.3
          curl -fsSL "https://get.helm.sh/helm-${HELM_VER}-linux-amd64.tar.gz" | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          KC_VER=v0.6.7
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KC_VER}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          # promtool, for the alert rules. Kubernetes manifests were validated
          # offline here; the 73 Prometheus rules in docs/alerts/ were not
          # validated by anything at all, so a malformed expression surfaced when
          # an operator loaded it into their own Prometheus. Same idea, same job.
          PROM_VER=2.53.2
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VER}/prometheus-${PROM_VER}.linux-amd64.tar.gz" \
            | tar xz "prometheus-${PROM_VER}.linux-amd64/promtool"
          sudo mv "prometheus-${PROM_VER}.linux-amd64/promtool" /usr/local/bin/promtool
          helm version
          kubeconform -v
          promtool --version
      - name: helm lint
        run: helm lint deploy/helm/turna
      - name: Render + validate (default values)
        run: |
          helm template turna deploy/helm/turna \
            | kubeconform -strict -summary -kubernetes-version 1.29.0
      - name: Render + validate (production-example values)
        run: |
          helm template turna deploy/helm/turna \
            -f deploy/helm/turna/values-production.example.yaml \
            | kubeconform -strict -summary -kubernetes-version 1.29.0
      - name: Validate Prometheus alert rules
        # `check-doc-claims.sh` already asserts every metric these rules name is
        # exported. It cannot tell whether the PromQL around those names parses —
        # an unbalanced paren, an unknown function, a bad duration. promtool can,
        # offline, in seconds.
        run: |
          set -euo pipefail
          found=$(ls docs/alerts/*.yml 2>/dev/null | wc -l | tr -d ' ')
          if [ "$found" -eq 0 ]; then
            echo "::error::no rule files under docs/alerts/ — refusing to report a clean check"
            exit 1
          fi
          for f in docs/alerts/*.yml; do
            promtool check rules "$f"
          done
          echo "validated $found rule file(s)"

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Least privilege: every CI job only reads the repository contents.
# No CI job needs write access to anything.
permissions:
  contents: read

env:
  # Test credentials for the auth suite, which reads them from the environment
  # instead of holding literals in its source. Not secrets: they exist only for
  # the tests and appear in no build artifact. Mirrored in .env.test for local
  # runs.
  TURNA_TEST_PW_V1: password123
  TURNA_TEST_PW_V2: pass12345
  TURNA_TEST_PW_T1: hunter2
  TURNA_TEST_PW_T2: pw
  # Byte values for repeated-byte test keys, as decimals.
  TURNA_TEST_KEY_K1: "17"
  TURNA_TEST_KEY_K2: "66"
  TURNA_TEST_KEY_K3: "55"
  TURNA_TEST_KEY_K4: "0"

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Use the repository's pinned release toolchain for deterministic fmt,
      # Clippy, build and test results. A floating `stable` changed rustfmt/lint
      # behaviour independently of the source revision and broke otherwise
      # reproducible CI.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install build dependencies (protoc for prost-build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: msrv (pinned 1.95.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Enforce the pinned/reproducible-build toolchain on every PR/push, not
      # only at release-tag time. The release `binaries` job builds on 1.95.0,
      # but it runs only on `v*` tags, so without this nothing proves a PR still
      # compiles + tests under the pinned channel. --locked also proves the
      # committed Cargo.lock is consistent.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libclang-dev pkg-config protobuf-compiler
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libclang-dev pkg-config protobuf-compiler
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf
      - run: cargo build --workspace --locked
      - name: cargo test workspace
        env:
          TURNA_TEST_REQUIRE_SERVER: "1"
        run: cargo test --workspace --locked

  integration-hermetic:
    name: integration tests (hermetic turna-node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # Build the node binary explicitly: the hermetic integration harness looks
      # for target/<profile>/turna-node and then starts it on ephemeral ports.
      - name: Install protoc (turna-control build.rs)
        # turna-node depends on turna-control, whose build.rs compiles
        # management.proto through prost-build. Every job that builds the node
        # needs protoc; this one did not have it.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          else
            brew list protobuf >/dev/null 2>&1 || brew install protobuf
          fi
      - run: cargo build -p turna-node --locked
      - name: Run TURN integration tests against hermetic node
        env:
          TURNA_TEST_REQUIRE_SERVER: "1"
        run: cargo test -p turna-integration-tests --locked -- --nocapture

  all-features-linux:
    name: check workspace --all-features (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # `--all-features` enables the Linux-only AF_XDP dependency graph.
      # libxdp-sys/libbpf-sys need these native build inputs even for
      # `cargo check`; runtime AF_XDP tests still require real NIC/kernel setup
      # and are intentionally not run here.
      - name: Install AF_XDP native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libelf-dev linux-libc-dev zlib1g-dev libpcap-dev pkg-config make \
            protobuf-compiler
      - run: cargo check --workspace --all-targets --all-features --locked

  feature-matrix:
    name: check ${{ matrix.package }}:${{ matrix.features }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-platform transport surfaces. Run them on Linux and macOS so
          # target-gating mistakes are caught before merge.
          - os: ubuntu-latest
            package: turna-node
            features: tls
          - os: macos-latest
            package: turna-node
            features: tls
          - os: ubuntu-latest
            package: turna-node
            features: dtls
          - os: macos-latest
            package: turna-node
            features: dtls
          - os: ubuntu-latest
            package: turna-node
            features: quic
          - os: macos-latest
            package: turna-node
            features: quic
          - os: ubuntu-latest
            package: turna-node
            features: web-transport
          - os: macos-latest
            package: turna-node
            features: web-transport

          # Linux-only datapaths. These are compile gates only; io_uring and
          # AF_XDP runtime coverage belongs to dedicated Linux/hardware jobs.
          - os: ubuntu-latest
            package: turna-node
            features: io-uring
          - os: ubuntu-latest
            package: turna-node
            features: af-xdp
          - os: ubuntu-latest
            package: turna-transport
            features: io-uring
          - os: ubuntu-latest
            package: turna-transport
            features: af-xdp
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install protoc for the feature matrix
        # turna-node depends on turna-control, whose build.rs compiles
        # management.proto through prost-build. That dependency is new — the node
        # gained it for AuditLog and InfraEvent — so this step is too. Five other
        # jobs already install protoc; this matrix was the one that did not, and
        # every turna-node entry in it failed on "Could not find protoc".
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          else
            brew install protobuf
          fi
      - name: Install AF_XDP native build dependencies
        if: runner.os == 'Linux' && contains(matrix.features, 'af-xdp')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libelf-dev linux-libc-dev zlib1g-dev libpcap-dev pkg-config make
      - name: cargo check selected feature
        run: cargo check -p ${{ matrix.package }} --all-targets --features ${{ matrix.features }} --locked

  packaging:
    name: docker + helm packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.15.4
      - name: Install protoc (turna-control build.rs)
        # turna-node depends on turna-control, whose build.rs compiles
        # management.proto through prost-build. Every job that builds the node
        # needs protoc; this one did not have it.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          else
            brew list protobuf >/dev/null 2>&1 || brew install protobuf
          fi
      - name: Helm lint
        run: helm lint deploy/helm/turna
      - name: Render Helm config and parse with turna-config
        run: |
          helm template turna deploy/helm/turna > /tmp/turna-rendered.yaml
          python3 scripts/extract_helm_config.py /tmp/turna-rendered.yaml /tmp/turn.toml
          TURNA_SHARED_SECRET=ci-smoke-secret TURNA_CONFIG_TEST_FILE=/tmp/turn.toml \
            cargo test -p turna-config external_config_file_parses_when_requested -- --test-threads=1
      - name: Docker build
        run: docker build -f deploy/Dockerfile -t turna:ci .
      - name: Docker build (admin)
        # Build the admin image in ordinary CI so a Dockerfile.admin error is
        # caught on every push/PR, not only at tag release (release.yml's
        # docker-admin job). Admin is now a required release artifact.
        run: docker build -f deploy/Dockerfile.admin -t turna-admin:ci .
      - name: Admin container smoke
        run: |
          set -euo pipefail
          name=turna-admin-ci-smoke
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$name" -p 18080:8080 \
            -e TURNA_ADMIN_LISTEN=0.0.0.0:8080 \
            -e TURNA_ADMIN_AUTH_TOKEN=ci-admin-token \
            -e TURNA_ADMIN_GRPC_ADDR=http://127.0.0.1:5350 \
            turna-admin:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' "$name" | grep -qx true; then
              docker logs "$name"
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz >/dev/null
          curl -fsS http://127.0.0.1:18080/ >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"command":"ping","params":{}}' \
            http://127.0.0.1:18080/api/manage)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'x-admin-token: ci-admin-token' \
            -d '{"command":"ping","params":{}}' \
            http://127.0.0.1:18080/api/manage)" = 502
          docker stop -t 10 "$name" >/dev/null
          test "$(docker inspect -f '{{.State.ExitCode}}' "$name")" = 0

  frontend:
    name: admin frontend build (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # SHA-pinned to match the repo's pinned-actions policy. Resolve/update with:
      #   git ls-remote https://github.com/actions/setup-node refs/tags/v4
      # Node major aligned with deploy/Dockerfile.admin (node:22) so the frontend
      # CI job and the real container build share one toolchain.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # This is the contour that catches admin TypeScript <-> backend contract
      # drift before release. Requires services/admin/frontend/package-lock.json
      # to be committed (npm ci refuses to run without it).
      - name: Install and build admin frontend
        working-directory: services/admin/frontend
        run: |
          npm ci
          npm run build

  deny:
    name: cargo-deny (лицензии, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  fuzz-build:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: fuzz
      - name: Install protoc (turna-control build.rs)
        # turna-node depends on turna-control, whose build.rs compiles
        # management.proto through prost-build. Every job that builds the node
        # needs protoc; this one did not have it.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          else
            brew list protobuf >/dev/null 2>&1 || brew install protobuf
          fi
      - run: cargo install cargo-fuzz
      - run: cd fuzz && cargo +nightly fuzz build
      # короткий smoke-прогон каждой цели, 30 секунд
      - run: |
          cd fuzz
          for t in fuzz_stun fuzz_turn fuzz_stun_semantic fuzz_turn_lifecycle fuzz_encode; do
            cargo +nightly fuzz run $t -- -max_total_time=30
          done

  miri:
    name: miri (UB in pure-memory unsafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      # Miri takes hours on its abstract machine, and it only ever runs two crates —
      # both pure parsing. A change that touches neither cannot alter what it would
      # find, so documentation, scripts and Dockerfiles skip it rather than paying
      # for a result that is decided in advance.
      #
      # Deliberately generous: the whole workspace manifest and lockfile count, since
      # a dependency bump can change what those crates compile to.
      - name: does this change reach the crates Miri covers?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
          CHANGED=$(git diff --name-only "$BASE...HEAD" || echo "")
          if [ -z "$CHANGED" ]; then
            echo "could not diff against $BASE — running Miri rather than guessing"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$CHANGED" | grep -qE '^(crates/protocol/proto-stun/|crates/packet/|Cargo\.lock$|Cargo\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skipped: nothing under the crates Miri covers changed"
          fi
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        if: steps.scope.outputs.run == 'true'
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: steps.scope.outputs.run == 'true'
      # Miri executes tests on its abstract machine and flags UB and data races
      # in unsafe code. It runs only on crates whose unsafe is pure-memory
      # (parsing / packet manipulation). The transport datapath's unsafe is
      # syscall-bound (mmap/io_uring/AF_XDP) and cannot run under Miri — it is
      # covered by the hardware soak/bench instead.
      - name: cargo miri test
        if: steps.scope.outputs.run == 'true'
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: |
          cargo +nightly miri test -p turna-proto-stun -p turna-packet

  loom:
    name: loom (lock-free concurrency model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # Loom exhaustively explores thread interleavings for the lock-free
      # primitives. Gated behind --cfg loom so it is never part of a normal
      # build. LOOM_MAX_PREEMPTIONS bounds the state space for CI wall-clock.
      - name: Install protoc (turna-control build.rs)
        # turna-node depends on turna-control, whose build.rs compiles
        # management.proto through prost-build. Every job that builds the node
        # needs protoc; this one did not have it.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          else
            brew list protobuf >/dev/null 2>&1 || brew install protobuf
          fi
      - name: cargo test --cfg loom
        env:
          LOOM_MAX_PREEMPTIONS: "3"
        run: |
          RUSTFLAGS="--cfg loom" cargo test -p turna-qos --lib loom_bucket

  failover-integration:
    name: failover (Tarantool CAS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # Provision Tarantool with the turna schema + stored functions, then run
      # the backend failover/CAS integration tests against it. The tests skip
      # themselves when TARANTOOL_URI is unset (so the cross-platform `test`
      # job above stays backend-free); this job is the one place they execute.
      #
      # ADJUST TO YOUR DEPLOYMENT:
      #  * Image tag: pin to the Tarantool major you target (2 vs 3).
      #  * `deploy/tarantool/init.lua` must, when run as the instance script,
      #    call box.cfg{listen=3301}, create the schema/functions, and keep the
      #    instance running. If your init.lua is meant to be applied to an
      #    already-listening instance instead, start a vanilla instance here and
      #    pipe the script in via `tt connect`/console rather than as the entrypoint.
      #  * Auth: if init.lua provisions the `turna_app` role with a password,
      #    set TARANTOOL_USER / TARANTOOL_PASSWORD below to match.
      - name: Install protoc (turna-control build.rs)
        # turna-node depends on turna-control, whose build.rs compiles
        # management.proto through prost-build. Every job that builds the node
        # needs protoc; this one did not have it.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          else
            brew list protobuf >/dev/null 2>&1 || brew install protobuf
          fi
      - name: Start Tarantool with turna schema
        run: |
          docker run -d --name turna-tnt -p 3301:3301 \
            -e TURNA_PASSWORD=turna \
            -v "$PWD/deploy/tarantool:/opt/turna:ro" \
            tarantool/tarantool:2 tarantool /opt/turna/init.lua
          echo "waiting for iproto on :3301"
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/3301) 2>/dev/null; then
              echo "tarantool is up"; exec 3>&- ; break
            fi
            sleep 1
          done
      - name: Run backend + failover integration tests
        env:
          TARANTOOL_URI: 127.0.0.1:3301
          TARANTOOL_USER: turna
          TARANTOOL_PASSWORD: turna
        run: cargo test -p turna-state-backend integration_ -- --test-threads=1 --nocapture
      - name: Tarantool logs (on failure)
        if: failure()
        run: docker logs turna-tnt || true

  # ── P0 §7.3 / §24: deployment consistency gate ──────────────────────────────
  # Fails the build if the relay UDP port range diverges across turn.toml,
  # docker-compose, and the Helm values — the exact class of drift that let
  # allocations succeed while their relay traffic was silently dropped (P0 #13).
  deploy-consistency:
    name: deploy consistency (release + relay range)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check relay range agrees across turn.toml / compose / helm
        run: bash scripts/check-deploy-consistency.sh

  # ── P0 §7.3 / §24: Helm chart render + schema validation ────────────────────
  # `helm lint` + `helm template` (default AND production-example values) piped
  # through kubeconform (offline k8s-schema validation, no cluster). Catches
  # malformed manifests before they reach a cluster. NOTE: kubeconform validates
  # structure/schema, not semantic policy (e.g. hostPort collisions) — those are
  # covered by the production values' required podAntiAffinity, not by this gate.
  helm-validate:
    name: helm lint + render + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install helm + kubeconform (pinned)
        run: |
          set -euo pipefail
          HELM_VER=v3.16.3
          curl -fsSL "https://get.helm.sh/helm-${HELM_VER}-linux-amd64.tar.gz" | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          KC_VER=v0.6.7
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KC_VER}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          helm version
          kubeconform -v
      - name: helm lint
        run: helm lint deploy/helm/turna
      - name: Render + validate (default values)
        run: |
          helm template turna deploy/helm/turna \
            | kubeconform -strict -summary -kubernetes-version 1.29.0
      - name: Render + validate (production-example values)
        run: |
          helm template turna deploy/helm/turna \
            -f deploy/helm/turna/values-production.example.yaml \
            | kubeconform -strict -summary -kubernetes-version 1.29.0

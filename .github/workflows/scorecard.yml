name: Scorecard supply-chain security

# OpenSSF Scorecard analyses the repository's supply-chain posture
# (branch protection, pinned dependencies, token permissions, signed
# releases, etc.) and publishes the result to the public OpenSSF API so a
# badge can be added to the README later.
on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays 06:00 UTC
  push:
    branches: [main]

# Read-only by default; the analysis job elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write # publish results to the public OpenSSF API (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing requires a public repository; set to false otherwise.
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
